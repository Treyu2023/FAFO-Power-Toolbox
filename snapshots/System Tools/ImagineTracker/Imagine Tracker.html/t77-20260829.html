<!DOCTYPE html>
<!-- Snapshots: newest 5 copies of THIS file live in snapshots/System Tools/ImagineTracker/Imagine Tracker.html/ (per app, not a global pool). Never leave .bak next to the live tool. See snapshots/README.md -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="aitoolbox-tool-id" content="imagine-tracker" />
  <title>Imagine Vault — HAVE / MISS</title>
  <link rel="stylesheet" href="../../shared/aitoolbox-ui.css">
  <link rel="stylesheet" href="../../shared/aitoolbox-layout.css">
  <style>
    :root {
      --bg: #05080c; --panel: #0c1220;
      --text: #f1f5f9; --muted: #9bb0c9;
      --have: #00f0ff; --miss: #ff2bd6; --gold: #f5c542; --ok: #34d399;
      --border: rgba(0, 240, 255, 0.22);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(ellipse at 10% -8%, rgba(0, 240, 255, 0.14), transparent 42%),
        radial-gradient(ellipse at 92% 0%, rgba(255, 43, 214, 0.12), transparent 38%),
        #05080c;
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; min-height: 100vh;
    }
    .nav {
      flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      padding: 10px 14px; background: rgba(6, 10, 18, 0.96);
      border-bottom: 1px solid var(--border); z-index: 30;
    }
    .nav h1 { font-size: 14px; letter-spacing: 0.08em; color: var(--have); }
    .pill {
      font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,200,0,.4); color: var(--gold);
    }
    .pill.ok { color: var(--ok); border-color: rgba(52,211,153,.5); }
    .pill.bad { color: #fb7185; border-color: rgba(255,43,214,.45); cursor: pointer; }
    .nav a, .nav button {
      font-size: 11px; font-weight: 700; padding: 7px 12px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,.16); background: transparent;
      color: var(--muted); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center;
    }
    .nav a.hot, .nav button.hot { border-color: var(--miss); color: #fff; background: rgba(255,43,214,.28); }
    .nav a:hover, .nav button:hover { color: var(--have); border-color: var(--have); }
    .nav button.primary { border-color: var(--have); color: #001018; background: var(--have); }
    .nav button.hot { border-color: var(--miss); color: #fff; background: rgba(255,43,214,.28); }
    .wrap {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      width: 100%; margin: 0 auto; padding: 12px 14px 18px; max-width: 1600px;
    }
    .banner {
      display: none; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px;
      font-size: 12px; line-height: 1.45;
    }
    .banner.show { display: block; }
    .banner.demo { border: 1px solid rgba(245,197,66,.4); background: rgba(245,197,66,.08); color: #fde68a; }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 10px; }
    @media (max-width: 720px) { .kpis { grid-template-columns: 1fr 1fr; } }
    .kpi {
      background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
    }
    .kpi .lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .kpi .val { font-size: 26px; font-weight: 800; margin-top: 2px; color: var(--have); }
    .kpi .val.miss { color: var(--miss); }
    .kpi .val.gold { color: var(--gold); }
    .tabs, .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .tab, .toolbar input, .toolbar select {
      font-size: 11px; border-radius: 999px; border: 1px solid rgba(0,240,255,.28);
      background: transparent; color: var(--muted); padding: 7px 12px; cursor: pointer;
    }
    .tab.active { background: rgba(0,240,255,.16); color: #fff; border-color: var(--have); }
    .toolbar input, .toolbar select { border-radius: 8px; color: var(--text); cursor: text; background: #05080c; }
    .toolbar input { flex: 1; min-width: 160px; }
    .grid {
      flex: 1; min-height: 0; overflow: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px; padding-bottom: 12px;
    }
    .tile {
      position: relative; display: flex; flex-direction: column;
      background: #070b12; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.06);
    }
    .tile.have { box-shadow: 0 0 0 3px var(--have), 0 0 22px rgba(0,240,255,.45); }
    .tile.miss { box-shadow: 0 0 0 3px var(--miss), 0 0 22px rgba(255,43,214,.45); }
    .frame {
      position: relative; aspect-ratio: 16 / 10; background: #03050a; overflow: hidden;
    }
    .frame img, .frame video, .frame svg {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .stamp {
      position: absolute; top: 8px; left: 8px; z-index: 2;
      font-size: 12px; font-weight: 900; letter-spacing: .1em;
      padding: 6px 10px; border-radius: 999px; pointer-events: none;
    }
    .tile.have .stamp { color: #001018; background: var(--have); box-shadow: 0 0 14px var(--have); }
    .tile.miss .stamp { color: #fff; background: var(--miss); box-shadow: 0 0 14px var(--miss); }
    .cap {
      padding: 8px 10px 10px; font-size: 12px; line-height: 1.4; color: var(--muted);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      min-height: 3.9em;
    }
    .cap strong { display: block; color: var(--text); font-size: 11px; letter-spacing: .04em; margin-bottom: 2px; }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 48px 16px; }
    .log-list { display: flex; flex-direction: column; gap: 8px; }
    .prompt-block {
      background: var(--panel); border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px; padding: 12px 14px;
    }
    .prompt-block .t { font-size: 13px; line-height: 1.45; white-space: pre-wrap; color: var(--text); }
    .prompt-block .s { font-size: 10px; color: #64748b; margin-top: 6px; font-family: Consolas, monospace; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
  <header class="nav">
    <a href="../../Toolbox Launcher.html" id="btnHome">← Launcher</a>
    <h1>🎬 IMAGINE VAULT</h1>
    <span class="pill bad" id="vaultPill">Vault …</span>
    <button type="button" class="primary" id="btnStart">▶ Start vault</button>
    <a class="hot" id="btnPaint" href="#">Paint Imagine tab</a>
    <button type="button" id="btnScan">↻ Scan disk</button>
    <button type="button" id="btnImagine">Open grok.com/imagine</button>
    <button type="button" id="btnFolder">📂 Folder</button>
    <button type="button" id="btnReport">📋 Report</button>
    <span data-fafo-layout-toolbar></span>
  </header>
  <div class="wrap" data-fafo-layout-root data-fafo-layout-app="imagine-vault" data-fafo-layout-type="rows" data-fafo-layout-pin="1" data-fafo-chrome="0">
    <div class="banner" id="banner"></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">HAVE — cyan on the thumb</div><div class="val" id="kpiHave">—</div></div>
      <div class="kpi"><div class="lbl">MISS — magenta on the thumb</div><div class="val miss" id="kpiMiss">—</div></div>
      <div class="kpi"><div class="lbl">Unique prompts</div><div class="val gold" id="kpiPrompts">—</div></div>
      <div class="kpi"><div class="lbl">Tiles</div><div class="val" id="kpiCount">—</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="all">All thumbs</button>
      <button type="button" class="tab" data-tab="miss">Missing</button>
      <button type="button" class="tab" data-tab="have">Have</button>
      <button type="button" class="tab" data-tab="prompts">Unique prompts</button>
      <button type="button" class="tab" data-tab="log">Scrape log</button>
    </div>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Filter name, prompt, id…" />
      <select id="typeFilter">
        <option value="">Videos + images</option>
        <option value="video">Videos</option>
        <option value="image">Images</option>
      </select>
    </div>
    <div class="grid" id="list"></div>
  </div>

  <script src="../../shared/aitoolbox-api.js"></script>
  <script src="../../shared/aitoolbox-ui.js"></script>
  <script src="../../shared/aitoolbox-layout.js"></script>
  <script src="../../shared/aitoolbox-pro.js"></script>
  <script>
    (function () {
      const VAULT = 'http://127.0.0.1:18767';
      const DEMO_ITEMS = [
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0001', hasFile: true, mediaType: 'video', filename: 'grok-video-neon-alley.mp4', prompt: 'Rain-slick alley, cyan neon kanji, slow dolly toward a glowing doorway.', hue: 185 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0002', hasFile: true, mediaType: 'video', filename: 'grok-video-orbit-burn.mp4', prompt: 'Camera orbits a chrome figurine as sparks crawl up the torso.', hue: 42 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0003', hasFile: false, mediaType: 'video', filename: '', prompt: 'Macro of melting stained glass, magenta rim light, 2s hold then crash zoom.', hue: 312 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0004', hasFile: false, mediaType: 'video', filename: '', prompt: 'Handheld night drive, dashboard glow, wipers in time with a kick drum.', hue: 205 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0005', hasFile: true, mediaType: 'image', filename: 'grok-image-still-frame.jpg', prompt: 'Still from the alley shot — doorway only, no figure.', hue: 168 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0006', hasFile: false, mediaType: 'image', filename: '', prompt: 'Wide establishing: wet rooftop, city grid, one window lit magenta.', hue: 268 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0007', hasFile: true, mediaType: 'video', filename: 'grok-video-tide-glass.mp4', prompt: 'Tide crawling over black glass, cyan foam, locked tripod.', hue: 196 },
        { id: '7a1c9e20-4b33-4c1a-9f0e-imagine0008', hasFile: false, mediaType: 'video', filename: '', prompt: 'Portrait: wind in a coat, magenta streetlamp, 24fps grain.', hue: 328 },
      ];

      function el(id) {
        try {
          if (!id) return null;
          return typeof id === 'string' ? document.getElementById(id) : id;
        } catch (_) { return null; }
      }
      function setText(id, text) {
        const n = el(id);
        if (n) n.textContent = text == null ? '' : String(text);
      }
      function bind(id, ev, fn) {
        const n = el(id);
        if (!n || !fn) return;
        n.addEventListener(ev, fn);
      }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"');
      }
      function toast(msg, kind) {
        try { window.AIToolboxUI?.toast?.(msg, kind || 'ok'); } catch (_) {}
      }

      function svgThumb(it) {
        const have = !!it.hasFile;
        const neon = have ? '#00f0ff' : '#ff2bd6';
        const hue = Number(it.hue != null ? it.hue : (parseInt((it.id || 'aa').slice(-2), 16) % 360));
        const a = 'hsl(' + hue + ',70%,18%)';
        const b = 'hsl(' + ((hue + 40) % 360) + ',80%,8%)';
        const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="' + a + '"/><stop offset="100%" stop-color="' + b + '"/></linearGradient></defs>' +
          '<rect width="320" height="200" fill="url(#g)"/>' +
          '<rect x="18" y="22" width="284" height="118" rx="10" fill="none" stroke="' + neon + '" stroke-width="3" opacity=".85"/>' +
          '<circle cx="250" cy="48" r="18" fill="' + neon + '" opacity=".35"/>' +
          '<rect x="36" y="150" width="' + (have ? 210 : 90) + '" height="10" rx="5" fill="' + neon + '" opacity=".7"/>' +
          '<rect x="36" y="168" width="160" height="7" rx="4" fill="#94a3b8" opacity=".35"/>' +
          '</svg>';
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      }

      let vaultOn = false;
      let demo = false;
      let tab = 'all';
      let catalog = { items: {}, haveFile: 0, missingFile: 0, uniquePrompts: 0, count: 0 };
      let prompts = [];
      let delta = [];

      async function vaultGet(path) {
        const r = await fetch(VAULT + path, { cache: 'no-store' });
        if (!r.ok) throw new Error('vault ' + r.status);
        const ct = r.headers.get('content-type') || '';
        if (ct.indexOf('json') >= 0) return r.json();
        return r.text();
      }
      async function vaultPost(path, body) {
        const r = await fetch(VAULT + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {}),
        });
        if (!r.ok) throw new Error('vault ' + r.status);
        return r.json();
      }
      function itemsArray() {
        const raw = catalog.items || {};
        if (Array.isArray(raw)) return raw;
        return Object.keys(raw).map((k) => raw[k]);
      }

      function applyDemo() {
        demo = true;
        vaultOn = false;
        const items = {};
        DEMO_ITEMS.forEach((it) => { items[it.id] = it; });
        catalog = {
          items,
          haveFile: DEMO_ITEMS.filter((x) => x.hasFile).length,
          missingFile: DEMO_ITEMS.filter((x) => !x.hasFile).length,
          uniquePrompts: DEMO_ITEMS.length,
          count: DEMO_ITEMS.length,
        };
        prompts = DEMO_ITEMS.map((it, i) => ({ prompt: it.prompt, lastSeen: new Date(Date.now() - i * 36e5).toISOString(), count: 1 + i }));
        delta = DEMO_ITEMS.filter((x) => !x.hasFile).map((x) => ({ ts: new Date().toISOString(), prompt: x.prompt, id: x.id }));
        const b = el('banner');
        b.className = 'banner show demo';
        b.textContent = 'Thumbnails sit on the tile — cyan ring = already downloaded, magenta = not saved. On your PC, Start vault to swap this sample for your real GrokImagine library. Paint Imagine tab puts the same rings on grok.com/imagine.';
      }

      function applyLive(stats, itemMap, uniqueRows, deltaRows) {
        demo = false;
        catalog = {
          items: itemMap || {},
          haveFile: stats.haveFile || 0,
          missingFile: stats.missingFile || 0,
          uniquePrompts: stats.uniquePrompts || 0,
          count: stats.count || 0,
          libraryDir: stats.libraryDir,
        };
        prompts = (uniqueRows && uniqueRows.prompts) || [];
        delta = (deltaRows && deltaRows.rows) || [];
        const b = el('banner');
        b.className = 'banner';
        b.textContent = '';
      }

      function renderKpis() {
        setText('kpiHave', catalog.haveFile);
        setText('kpiMiss', catalog.missingFile);
        setText('kpiPrompts', catalog.uniquePrompts);
        setText('kpiCount', catalog.count);
        const pill = el('vaultPill');
        if (vaultOn) {
          pill.className = 'pill ok';
          setText('vaultPill', '● Vault online');
        } else {
          pill.className = 'pill bad';
          setText('vaultPill', demo ? '○ Sample — start vault' : '○ Vault offline');
        }
      }

      function filteredClips() {
        const q = (el('search').value || '').trim().toLowerCase();
        const type = el('typeFilter').value;
        return itemsArray().filter((it) => {
          if (tab === 'miss' && it.hasFile) return false;
          if (tab === 'have' && !it.hasFile) return false;
          if (type && (it.mediaType || '') !== type) return false;
          if (!q) return true;
          const blob = [it.filename, it.prompt, it.id, it.title, (it.tags || []).join(' ')].join(' ').toLowerCase();
          return blob.indexOf(q) >= 0;
        });
      }

      function mediaTag(it) {
        if (it.thumbUrl) return '<img alt="" src="' + esc(it.thumbUrl) + '">';
        if (vaultOn && it.hasFile && it.id) {
          const src = VAULT + '/preview?id=' + encodeURIComponent(it.id);
          if ((it.mediaType || '') === 'image' || /\.(png|jpe?g|webp|gif)$/i.test(it.filename || '')) {
            return '<img alt="" src="' + esc(src) + '">';
          }
          return '<video muted loop playsinline autoplay preload="metadata" src="' + esc(src) + '"></video>';
        }
        return '<img alt="" src="' + esc(svgThumb(it)) + '">';
      }

      function renderList() {
        const box = el('list');
        if (tab === 'prompts' || tab === 'log') {
          box.className = 'log-list';
          const rows = tab === 'prompts'
            ? prompts.filter((p) => {
                const q = (el('search').value || '').trim().toLowerCase();
                return !q || String(p.prompt || '').toLowerCase().indexOf(q) >= 0;
              })
            : delta;
          if (!rows.length) {
            box.innerHTML = '<div class="empty">Nothing in this view yet.</div>';
            return;
          }
          box.innerHTML = rows.map((p) =>
            '<article class="prompt-block"><div class="t">' + esc(p.prompt || p.text || JSON.stringify(p)) + '</div>' +
            '<div class="s">' + esc(p.count != null ? (p.count + '× · ') : '') + esc(p.lastSeen || p.firstSeen || p.ts || '') +
            (p.id ? ' · ' + esc(p.id) : '') + '</div></article>'
          ).join('');
          return;
        }
        box.className = 'grid';
        const rows = filteredClips();
        if (!rows.length) {
          box.innerHTML = '<div class="empty">' + (vaultOn
            ? 'Nothing in this filter. Harvest from grok.com/imagine or Scan disk.'
            : 'Start the vault to load your real HAVE / MISS thumbs.') + '</div>';
          return;
        }
        box.innerHTML = rows.map((it) => {
          const have = !!it.hasFile;
          const name = it.filename || it.title || (have ? 'On disk' : 'Not downloaded');
          return '<article class="tile ' + (have ? 'have' : 'miss') + '" data-id="' + esc(it.id || '') + '">' +
            '<div class="frame">' + mediaTag(it) +
            '<span class="stamp">' + (have ? 'HAVE' : 'MISS') + '</span></div>' +
            '<div class="cap"><strong>' + esc(name) + '</strong>' + esc(it.prompt || 'No prompt captured yet') + '</div></article>';
        }).join('');
        box.querySelectorAll('.tile[data-id]').forEach((tile) => {
          tile.addEventListener('click', () => reveal(tile.getAttribute('data-id')));
        });
      }

      async function reveal(id) {
        if (!id) return;
        if (!vaultOn) { toast('Start the vault to open the file on disk', 'warn'); return; }
        try { await vaultGet('/reveal?id=' + encodeURIComponent(id)); }
        catch (_) { toast('Could not reveal that file', 'warn'); }
      }

      async function refresh() {
        try {
          const health = await vaultGet('/health');
          vaultOn = !!(health && health.ok);
        } catch (_) { vaultOn = false; }
        if (!vaultOn) {
          applyDemo();
          renderKpis();
          renderList();
          return;
        }
        try {
          const [stats, cat, uniq, log] = await Promise.all([
            vaultGet('/stats'),
            vaultGet('/catalog'),
            vaultGet('/prompts/unique'),
            vaultGet('/prompts/delta?limit=80'),
          ]);
          applyLive(stats, (cat && cat.items) || {}, uniq, log);
        } catch (e) {
          applyDemo();
          toast(e.message || 'Vault read failed', 'warn');
        }
        renderKpis();
        renderList();
      }

      async function startVault() {
        const btn = el('btnStart');
        if (btn) btn.disabled = true;
        try {
          toast('Starting Imagine Vault…', 'ok');
          if (window.AIToolboxAPI?.launchLocalTool) {
            await AIToolboxAPI.launchLocalTool('imagine-tracker', { action: 'run' });
          } else {
            location.href = 'aitoolbox://imagine-tracker';
          }
          for (let i = 0; i < 12; i++) {
            await new Promise((r) => setTimeout(r, 700));
            try { const h = await vaultGet('/health'); if (h && h.ok) break; } catch (_) {}
          }
          await refresh();
          toast(vaultOn ? 'Vault online — thumbs from disk' : 'Vault still starting — hit Scan in a few seconds', vaultOn ? 'ok' : 'warn');
        } catch (e) {
          toast(e.message || 'Start failed', 'warn');
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      async function scanDisk() {
        if (!vaultOn) { await startVault(); if (!vaultOn) return; }
        try {
          toast('Scanning watch folders…', 'ok');
          await vaultPost('/scan', { deep: true });
          setTimeout(refresh, 1200);
          setTimeout(refresh, 4000);
        } catch (e) { toast(e.message || 'Scan failed', 'warn'); }
      }

      function paintBookmarklet() {
        const src = "javascript:void fetch('http://127.0.0.1:18767/ids').then(r=>r.json()).then(j=>{var M=j.items||{},U=/(?:grok-video-|grok-image-|share-videos\\/|share-images\\/|generated\\/|\\/imagine\\/(?:post\\/)?)([0-9a-f-]{36})/i,B=/\\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\\b/i;function id(s){s=String(s||'');var m=U.exec(s);if(m)return m[1].toLowerCase();if(/grok-video|assets\\.grok|imagine-public|share-video/i.test(s)){m=B.exec(s);if(m)return m[1].toLowerCase();}return ''}function mark(el,h){el.style.outline=h?'3px solid #00f0ff':'3px solid #ff2bd6';el.style.boxShadow=h?'0 0 16px #00f0ff':'0 0 16px #ff2bd6';el.style.position=el.style.position||'relative';var b=el.querySelector(':scope>.fafoH');if(!b){b=document.createElement('div');b.className='fafoH';b.style.cssText='position:absolute;top:8px;left:8px;z-index:9;font:800 11px Segoe UI;padding:5px 8px;border-radius:999px';el.appendChild(b);}b.textContent=h?'HAVE':'MISS';b.style.background=h?'#00f0ff':'#ff2bd6';b.style.color=h?'#001018':'#fff';}document.querySelectorAll('img,video,a[href]').forEach(function(n){var i=id(n.src||n.currentSrc||n.poster||n.href||'');if(!i||!M[i])return;mark(n.closest('article,a,div,li,button')||n,!!M[i].hasFile);});});";
        return src;
      }

      async function copyPainter() {
        const js = paintBookmarklet();
        try {
          await navigator.clipboard.writeText(js);
          toast('Painter copied — paste in the address bar on grok.com/imagine, or bookmark it and click on that tab', 'ok');
        } catch (_) {
          try { prompt('Bookmark this (drag after paste into a bookmark):', js); } catch (__) {}
        }
        try { window.open('https://grok.com/imagine', '_blank', 'noopener'); } catch (_) {}
      }

      async function copyReport() {
        const text = [
          'FAFO Imagine Vault',
          'Time: ' + new Date().toISOString(),
          'Vault: ' + (vaultOn ? 'online' : (demo ? 'sample preview' : 'offline')),
          'HAVE: ' + catalog.haveFile,
          'MISS: ' + catalog.missingFile,
          'Tiles: ' + catalog.count,
        ].join('\n');
        try { await navigator.clipboard.writeText(text); toast('Report copied', 'ok'); }
        catch (_) { try { prompt('Copy report:', text); } catch (__) {} }
      }

      document.querySelectorAll('.tab').forEach((btn) => {
        btn.addEventListener('click', () => {
          tab = btn.dataset.tab;
          document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b === btn));
          renderList();
        });
      });
      bind('search', 'input', renderList);
      bind('typeFilter', 'change', renderList);
      bind('btnStart', 'click', startVault);
      bind('btnScan', 'click', scanDisk);
      bind('vaultPill', 'click', () => { if (!vaultOn) startVault(); else refresh(); });
      bind('btnImagine', 'click', () => { window.open('https://grok.com/imagine', '_blank', 'noopener'); });
      bind('btnPaint', 'click', copyPainter);
      bind('btnFolder', 'click', async () => {
        try {
          if (window.AIToolboxAPI?.launchLocalTool) {
            await AIToolboxAPI.launchLocalTool('imagine-tracker', { action: 'folder' });
          }
        } catch (_) {}
      });
      bind('btnReport', 'click', copyReport);
      bind('btnHome', 'click', (e) => {
        if (window.AIToolboxUI?.navigateToolbox) {
          e.preventDefault();
          AIToolboxUI.navigateToolbox('../../Toolbox Launcher.html');
        }
      });
      const paintBtn = el('btnPaint');
      if (paintBtn) paintBtn.setAttribute('href', paintBookmarklet());

      window.AITOOLBOX_PRO = {
        toolId: 'imagine-tracker',
        title: 'Imagine Vault',
        counterparts: ['media-hub', 'media-library', 'file-organizer'],
      };

      refresh();
      setInterval(() => { if (vaultOn) refresh(); }, 12000);
    })();
  </script>
</body>
</html>
