<!DOCTYPE html>
<!-- Snapshots: newest 5 copies of THIS file live in snapshots/Movie File Manager/Media Hub.html/ (per app, not a global pool). Never leave .bak next to the live tool. See snapshots/README.md -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Hub — Library · Duplicates · Match · Compare</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="stylesheet" href="../shared/aitoolbox-ui.css?v=3.0.5">
<link rel="stylesheet" href="../shared/aitoolbox-layout.css?v=3.0.5">
  <style>
    :root {
      --bg: #0a1020;
      --panel: #121826;
      --charcoal: #1a2233;
      --accent: #00e5ff;
      --accent2: #ff2bd6;
      --gold: #f5c542;
      --text: #f2f4f8;
      --muted: #b4bdd0;
      --ok: #3dff9a;
      --focus: #f5c542;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .hub-bar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px;
      background: linear-gradient(180deg, #162033, #0c1422);
      border-bottom: 1px solid rgba(0, 229, 255, 0.28);
      z-index: 30;
      position: relative;
    }
    .hub-bar h1 {
      font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--accent); margin-right: 6px;
    }
    .hub-tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 auto; min-width: 220px; }
    .hub-tab {
      appearance: none; border: 1px solid rgba(0, 229, 255, 0.32);
      background: transparent; color: var(--muted);
      padding: 7px 12px; border-radius: 999px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
      transition: color 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .hub-tab:hover { color: var(--accent); border-color: var(--accent); }
    .hub-tab.active {
      background: rgba(0, 229, 255, 0.16);
      color: #fff; border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }
    .hub-meta { font-size: 10px; color: var(--muted); max-width: 280px; line-height: 1.35; }
    .hub-meta strong { color: var(--ok); }
    .hub-actions { display: flex; gap: 6px; align-items: center; }
    .hub-actions a, .hub-actions button {
      font-size: 11px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18); background: transparent;
      color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600;
    }
    .hub-actions a:hover, .hub-actions button:hover {
      color: var(--accent); border-color: var(--accent);
    }
    .frame-wrap { flex: 1; min-height: 0; position: relative; background: #05080f; }
    .frame-wrap .fafo-panel-chrome { display: none !important; }
    .frame-wrap .fafo-panel-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .frame-wrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0a1020;
    }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, #1a2238, #0a1020 70%);
      transition: opacity 0.3s;
    }
    .loading.hide { opacity: 0; pointer-events: none; }
    .loading.fail { opacity: 1; pointer-events: auto; flex-direction: column; gap: 12px; text-align: center; padding: 24px; }
    .loading.fail .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .loading.fail button, .loading.fail a {
      font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(0,229,255,.45); background: rgba(0,229,255,.12); color: var(--accent);
      text-decoration: none;
    }
    .loading.fail button.ghost, .loading.fail a.ghost {
      border-color: rgba(255,255,255,.22); background: transparent; color: var(--muted);
    }
    .server-badge {
      font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(245,197,66,.5);
      color: var(--gold); background: rgba(245,197,66,.1); white-space: nowrap;
    }
    .server-badge.ok { color: var(--ok); border-color: rgba(61,255,154,.5); background: rgba(61,255,154,.1); }
    .server-badge.bad { color: #ff7a9a; border-color: rgba(255,43,214,.45); background: rgba(255,43,214,.1); cursor: pointer; }
    .hub-actions #btnStartServer {
      border-color: rgba(61,255,154,.45); color: var(--ok);
    }
    .kbd-hint {
      font-size: 10px; color: var(--muted); padding: 4px 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12); white-space: nowrap;
    }
    .kbd-hint kbd {
      font-family: Consolas, monospace; font-size: 10px; color: var(--gold);
      padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(245,197,66,.4);
      background: rgba(0,0,0,.35);
    }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.28);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }

    html.hub-embedded .hub-tabs { display: none; }
    html.hub-embedded .kbd-hint { display: none; }
  </style>
</head>
<body>
  <header class="hub-bar">
    <h1>🗂️ MEDIA</h1>
    <span class="server-badge" id="serverBadge" title="Toolbox server status">Server …</span>
    <span class="server-badge" id="pairHealth" title="Pair health — complete / broken">Pairs …</span>
    <div class="hub-tabs" id="hubTabs" role="tablist">
      <button type="button" class="hub-tab active" data-tab="library" role="tab" aria-selected="true" tabindex="0"
              data-tip-title="Library" data-tip="Browse, preview, tag, and search your media catalog.">Library</button>
      <button type="button" class="hub-tab" data-tab="duplicates" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Duplicates" data-tip="Find and clean duplicate files (full Duplicate Manager).">Duplicates</button>
      <button type="button" class="hub-tab" data-tab="organizer" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Organizer" data-tip="Batch tag, rank, and rename catalog items.">Organizer</button>
      <button type="button" class="hub-tab" data-tab="match" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Guided Match" data-tip="Try candidates one-by-one per source file until you lock a pair.">Match</button>
      <button type="button" class="hub-tab" data-tab="pairs" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Pair Review" data-tip="Keyboard accept/reject queue before renames.">Review</button>
      <button type="button" class="hub-tab" data-tab="video" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Video Comparator" data-tip="Side-by-side / slider sync. Catalog search + highlight-to-match.">Video</button>
      <button type="button" class="hub-tab" data-tab="image" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Image Comparator" data-tip="Slider compare for stills. Catalog search + highlight-to-match.">Image</button>
      <button type="button" class="hub-tab" data-tab="companion" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Name match" data-tip="Match dumps whose names no longer match the originals.">Name match</button>
    </div>
    <div class="hub-meta" id="hubMeta">Browse &amp; tag here · pair with <strong>Guided Match</strong> in Compare Hub · dups &amp; rename in tabs.</div>
    <span class="kbd-hint" title="Keyboard"><kbd>1</kbd>–<kbd>8</kbd> tabs · <kbd>←</kbd><kbd>→</kbd> · <kbd>R</kbd> report</span>
    <div class="hub-actions">
      <span data-fafo-layout-toolbar></span>
      <a href="../Toolbox Launcher.html" data-tip-title="Launcher" data-tip="Return to the main toolbox menu.">← Launcher</a>
      <button type="button" id="btnStartServer" data-legacy-server-chrome
              data-tip-title="Start Server" data-tip="Start the toolbox backend if offline (use top S1/S2 bar when shown).">▶ Start Server</button>
      <a href="Compare Hub.html#match" data-tip-title="Guided Match" data-tip="Process-of-elimination pairing with big previews and learning.">🎯 Guided Match</a>
      <a href="Compare Hub.html" data-tip-title="Compare Hub" data-tip="Pair review + video/image comparators in one place.">⇄ Compare Hub</a>
      <a href="Mismatched Source Companion.html" data-tip-title="Mismatched Source Companion" data-tip="Match and rename dumps whose names no longer match the originals. Not FlashVSR.">🔗 Name match</a>
      <button type="button" id="btnCopyReport" data-tip-title="Report" data-tip="Copy a short hub status summary to the clipboard.">📋 Report</button>
      <button type="button" id="btnPopout" data-tip-title="Pop out" data-tip="Open this workspace in its own full window.">↗ Pop out</button>
    </div>
  </header>
  <!-- Hub itself is a thin shell; Library / Duplicates / Organizer each save their own modular layouts -->
  <div class="frame-wrap"
       data-fafo-layout-root
       data-fafo-layout-app="media-hub"
       data-fafo-layout-type="rows"
       data-fafo-layout-pin="1"
       data-fafo-layout-dock="0">
    <div data-fafo-panel="workspace" data-fafo-panel-title="Workspace" data-fafo-chrome="0" data-fafo-flex="1" style="display:flex;flex-direction:column;min-height:0;position:relative;flex:1">
    <div class="loading" id="loading">Loading workspace…</div>
    <iframe id="hubFrame" title="Media workspace" allow="autoplay; fullscreen" style="flex:1;border:0;width:100%;min-height:0"></iframe>
    </div>
  </div>

  <script src="../shared/aitoolbox-config.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-version.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-runtime.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-media.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-dom.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-hub.js?v=3.0.5"></script>
    <script src="../shared/aitoolbox-api.js?v=3.0.5"></script>
  <script src="../shared/aitoolbox-ui.js?v=3.0.5"></script>
  <script src="../shared/aitoolbox-layout.js?v=3.0.5"></script>
  <script src="../shared/aitoolbox-pro.js?v=3.0.5"></script>
  <script>
    (function () {
      if (!window.AIToolboxHub || !AIToolboxHub.mount) {
        document.getElementById('loading').textContent = 'Hub runtime failed to load.';
        return;
      }
      const WS = AIToolboxHub.mediaWorkspaceTabs();
      AIToolboxHub.mount({
        hubName: 'Media Hub',
        tabs: WS,
        order: AIToolboxHub.MEDIA_WORKSPACE_ORDER.slice(),
        aliases: AIToolboxHub.MEDIA_WORKSPACE_ALIASES,
        defaultTab: 'library',
        lsKey: 'fafo_media_hub_last_tab',
        pairHealthId: 'pairHealth',
        forwardSearchOnTab: 'duplicates',
        messageType: 'fafo-hub-tab',
        keyMap: AIToolboxHub.mediaWorkspaceKeyMap(),
        reportTitle: 'FAFO Media Hub',
        reportLines: ['Workspace: Library · Duplicates · Organizer · Match · Review · Video · Image · Name match'],
      });
    })();
  </script>

<script data-tool-polish="media-hub">
/* Tool polish: media-hub — Esc → launcher (shared UI owns layered Esc), load toast */
(function(){
  if (window.__tbToolPolish) return; window.__tbToolPolish = true;
  const TOOL_ID = "media-hub";
  const TOOL_NAME = "Media Hub";
  function launcherHref(){
    try {
      if (window.AIToolboxUI?.launcherHref) return AIToolboxUI.launcherHref();
      if (location.hostname === '127.0.0.87' || location.port === '18765')
        return 'http://127.0.0.87:18765/toolbox/Toolbox%20Launcher.html';
    } catch(_){}
    const a = document.querySelector('a[href*="Toolbox Launcher"], a.toolbox-back');
    if (a?.href) return a.href;
    return '../Toolbox Launcher.html';
  }
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (window.AIToolboxUI?.bindEscToLauncher) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (t?.closest?.('[role="dialog"], .modal, .overlay, .ui-modal')) return;
    location.href = launcherHref();
  }, true);
  window.addEventListener('load', function(){
    try {
      if (sessionStorage.getItem('tb_launch_toast_'+TOOL_ID)) return;
      sessionStorage.setItem('tb_launch_toast_'+TOOL_ID, '1');
      if (window.AIToolboxUI?.toast) AIToolboxUI.toast(TOOL_NAME + ' ready · Esc = launcher', 'ok');
    } catch(_){}
  });
  window.addEventListener('error', function(ev){
    if (!ev?.filename || !/\.js($|\?)/i.test(ev.filename)) return;
    try { window.AIToolboxUI?.toast?.('Script failed: ' + (ev.message||'error').slice(0,80), 'warn'); } catch(_){}
  });
})();
</script>
</body>
</html>
