<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Hub — Library · Duplicates · Organizer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="stylesheet" href="../shared/aitoolbox-ui.css">
  <style>
    :root {
      --bg: #050508; --panel: #0c0c12; --accent: #00f3ff; --accent2: #7c5cff;
      --text: #e8e8ec; --muted: #888; --ok: #00ff88;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .hub-bar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px;
      background: linear-gradient(180deg, #101018, #0a0a10);
      border-bottom: 1px solid rgba(0, 243, 255, 0.22);
      z-index: 5;
    }
    .hub-bar h1 {
      font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--accent); margin-right: 6px;
    }
    .hub-tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .hub-tab {
      appearance: none; border: 1px solid rgba(0, 243, 255, 0.28);
      background: transparent; color: var(--muted);
      padding: 7px 12px; border-radius: 999px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
      transition: 0.15s;
    }
    .hub-tab:hover { color: var(--accent); border-color: var(--accent); }
    .hub-tab.active {
      background: rgba(0, 243, 255, 0.16);
      color: #fff; border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.25);
    }
    .hub-meta { font-size: 10px; color: var(--muted); max-width: 280px; line-height: 1.35; }
    .hub-meta strong { color: var(--ok); }
    .hub-actions { display: flex; gap: 6px; align-items: center; }
    .hub-actions a, .hub-actions button {
      font-size: 11px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.14); background: transparent;
      color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600;
    }
    .hub-actions a:hover, .hub-actions button:hover {
      color: var(--accent); border-color: var(--accent);
    }
    .frame-wrap { flex: 1; min-height: 0; position: relative; background: #000; }
    .frame-wrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #050508;
    }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, #141428, #050508 70%);
      transition: opacity 0.3s;
    }
    .loading.hide { opacity: 0; }
  </style>
</head>
<body>
  <header class="hub-bar">
    <h1>🗂️ MEDIA HUB</h1>
    <div class="hub-tabs" id="hubTabs" role="tablist">
      <button type="button" class="hub-tab active" data-tab="library" role="tab">Library</button>
      <button type="button" class="hub-tab" data-tab="duplicates" role="tab">Duplicates</button>
      <button type="button" class="hub-tab" data-tab="organizer" role="tab">Organizer</button>
    </div>
    <div class="hub-meta" id="hubMeta">Browse &amp; tag here · pair with <strong>Guided Match</strong> in Compare Hub · dups &amp; rename in tabs.</div>
    <div class="hub-actions">
      <a href="../Toolbox Launcher.html">← Launcher</a>
      <a href="Compare Hub.html#match" title="Guided match + pair review + sliders">🎯 Guided Match</a>
      <a href="Compare Hub.html" title="Pair review + video/image comparators">⇄ Compare Hub</a>
      <a href="VSR Pipeline Manager.html">⚡ VSR</a>
      <button type="button" id="btnPopout" title="Open this tab full-window">↗ Pop out</button>
    </div>
  </header>
  <div class="frame-wrap">
    <div class="loading" id="loading">Loading workspace…</div>
    <iframe id="hubFrame" title="Media workspace" allow="autoplay; fullscreen"></iframe>
  </div>

  <script src="../shared/aitoolbox-api.js"></script>
  <script>
    (function () {
      const TABS = {
        library: {
          path: 'Media Library Manager.html',
          title: 'Media Library',
          meta: 'Catalog, preview, pair & search. Use <strong>Duplicates</strong> tab for full cleanup.'
        },
        duplicates: {
          path: '../File Tools/Duplicate File Manager.html',
          title: 'Duplicates',
          meta: 'Scan, compare, merge & recycle exact/near duplicates — same library server.'
        },
        organizer: {
          path: 'File Organizer.html',
          title: 'File Organizer',
          meta: 'Rename, tag, rank, merge same-named folders — metadata-first (no grid).'
        }
      };

      const frame = document.getElementById('hubFrame');
      const loading = document.getElementById('loading');
      const meta = document.getElementById('hubMeta');
      let current = 'library';

      function tabFromHash() {
        const h = (location.hash || '').replace(/^#/, '').toLowerCase();
        if (h === 'dupes' || h === 'duplicates' || h === 'duplicate') return 'duplicates';
        if (h === 'organizer' || h === 'org' || h === 'organize') return 'organizer';
        if (h === 'library' || h === 'lib' || h === '') return 'library';
        return TABS[h] ? h : 'library';
      }

      async function resolveSrc(tabId) {
        const t = TABS[tabId];
        let toolboxPath = t.path.startsWith('../')
          ? t.path.replace(/^\.\.\//, '')
          : 'Movie File Manager/' + t.path;
        let src = t.path;
        try {
          if (window.AIToolboxAPI?.isOnline && window.AIToolboxAPI?.toolPageUrl) {
            const on = await AIToolboxAPI.isOnline(false, 1500).catch(() => false);
            if (on) src = AIToolboxAPI.toolPageUrl(toolboxPath);
          }
        } catch (_) { /* ignore */ }
        // Deep-link query (folder/scan) only for duplicates
        if (tabId === 'duplicates' && location.search) {
          src += (String(src).includes('?') ? '&' : '?') + location.search.replace(/^\?/, '');
        }
        return src;
      }

      async function showTab(id, pushHash) {
        if (!TABS[id]) id = 'library';
        current = id;
        document.querySelectorAll('.hub-tab').forEach((b) => {
          b.classList.toggle('active', b.dataset.tab === id);
        });
        const t = TABS[id];
        document.title = t.title + ' — Media Hub';
        meta.innerHTML = t.meta;
        if (pushHash !== false) {
          const hash = id === 'library' ? 'library' : id;
          if (location.hash.replace(/^#/, '') !== hash) {
            history.replaceState(null, '', '#' + hash);
          }
        }
        loading.classList.remove('hide');
        loading.textContent = 'Loading ' + t.title + '…';
        frame.onload = () => loading.classList.add('hide');
        frame.src = await resolveSrc(id);
      }

      document.getElementById('hubTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.hub-tab');
        if (!btn) return;
        showTab(btn.dataset.tab, true);
      });

      document.getElementById('btnPopout').addEventListener('click', async () => {
        window.open(await resolveSrc(current), '_blank');
      });

      window.addEventListener('hashchange', () => showTab(tabFromHash(), false));

      // Boot
      showTab(tabFromHash(), true);
      // polish: number keys switch tabs
      document.addEventListener('keydown', function hubTabKeys(e){
        if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
        const map = { '1':'library', '2':'duplicates', '3':'organizer' };
        if (map[e.key]) showTab(map[e.key], true);
      });
    })();
  </script>

<script data-tool-polish="media-hub">
/* Tool polish: media-hub — Esc → launcher, load toast, error surface */
(function(){
  if (window.__tbToolPolish) return; window.__tbToolPolish = true;
  const TOOL_ID = "media-hub";
  const TOOL_NAME = "Media Hub";
  function launcherHref(){
    try {
      if (window.AIToolboxUI?.launcherHref) return AIToolboxUI.launcherHref();
      if (location.hostname === '127.0.0.87' || location.port === '18765')
        return 'http://127.0.0.87:18765/toolbox/Toolbox%20Launcher.html';
    } catch(_){}
    const a = document.querySelector('a[href*="Toolbox Launcher"], a.toolbox-back');
    if (a?.href) return a.href;
    return '../Toolbox Launcher.html';
  }
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (t?.closest?.('[role="dialog"], .modal, .overlay, .ui-modal')) return;
    location.href = launcherHref();
  }, true);
  // One soft status toast so launch failures are visible
  window.addEventListener('load', function(){
    try {
      if (sessionStorage.getItem('tb_launch_toast_'+TOOL_ID)) return;
      sessionStorage.setItem('tb_launch_toast_'+TOOL_ID, '1');
      if (window.AIToolboxUI?.toast) AIToolboxUI.toast(TOOL_NAME + ' ready · Esc = launcher', 'ok');
    } catch(_){}
  });
  // Surface failed module loads
  window.addEventListener('error', function(ev){
    if (!ev?.filename || !/\.js($|\?)/i.test(ev.filename)) return;
    try { window.AIToolboxUI?.toast?.('Script failed: ' + (ev.message||'error').slice(0,80), 'warn'); } catch(_){}
  });
})();
</script>
</body>
</html>
