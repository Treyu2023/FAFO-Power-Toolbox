<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Hub — Library · Duplicates · Organizer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂️</text></svg>">
  <link rel="stylesheet" href="../shared/aitoolbox-ui.css?v=3.5.06">
<link rel="stylesheet" href="../shared/aitoolbox-layout.css?v=3.5.06">
  <style>
    :root {
      --bg: #0a1020;
      --panel: #121826;
      --charcoal: #1a2233;
      --accent: #00e5ff;
      --accent2: #ff2bd6;
      --gold: #f5c542;
      --text: #f2f4f8;
      --muted: #b4bdd0;
      --ok: #3dff9a;
      --focus: #f5c542;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column;
    }
    .hub-bar {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px;
      background: linear-gradient(180deg, #162033, #0c1422);
      border-bottom: 1px solid rgba(0, 229, 255, 0.28);
      z-index: 5;
    }
    .hub-bar h1 {
      font-size: 14px; font-weight: 700; letter-spacing: 0.06em;
      color: var(--accent); margin-right: 6px;
    }
    .hub-tabs { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
    .hub-tab {
      appearance: none; border: 1px solid rgba(0, 229, 255, 0.32);
      background: transparent; color: var(--muted);
      padding: 7px 12px; border-radius: 999px; cursor: pointer;
      font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
      transition: color 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .hub-tab:hover { color: var(--accent); border-color: var(--accent); }
    .hub-tab.active {
      background: rgba(0, 229, 255, 0.16);
      color: #fff; border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }
    .hub-meta { font-size: 10px; color: var(--muted); max-width: 280px; line-height: 1.35; }
    .hub-meta strong { color: var(--ok); }
    .hub-actions { display: flex; gap: 6px; align-items: center; }
    .hub-actions a, .hub-actions button {
      font-size: 11px; padding: 6px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18); background: transparent;
      color: var(--muted); text-decoration: none; cursor: pointer; font-weight: 600;
    }
    .hub-actions a:hover, .hub-actions button:hover {
      color: var(--accent); border-color: var(--accent);
    }
    .frame-wrap { flex: 1; min-height: 0; position: relative; background: #05080f; }
    .frame-wrap iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; background: #0a1020;
    }
    .loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; pointer-events: none;
      background: radial-gradient(ellipse at 50% 30%, #1a2238, #0a1020 70%);
      transition: opacity 0.3s;
    }
    .loading.hide { opacity: 0; pointer-events: none; }
    .loading.fail { opacity: 1; pointer-events: auto; flex-direction: column; gap: 12px; text-align: center; padding: 24px; }
    .loading.fail .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .loading.fail button, .loading.fail a {
      font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid rgba(0,229,255,.45); background: rgba(0,229,255,.12); color: var(--accent);
      text-decoration: none;
    }
    .loading.fail button.ghost, .loading.fail a.ghost {
      border-color: rgba(255,255,255,.22); background: transparent; color: var(--muted);
    }
    .server-badge {
      font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(245,197,66,.5);
      color: var(--gold); background: rgba(245,197,66,.1); white-space: nowrap;
    }
    .server-badge.ok { color: var(--ok); border-color: rgba(61,255,154,.5); background: rgba(61,255,154,.1); }
    .server-badge.bad { color: #ff7a9a; border-color: rgba(255,43,214,.45); background: rgba(255,43,214,.1); cursor: pointer; }
    .hub-actions #btnStartServer {
      border-color: rgba(61,255,154,.45); color: var(--ok);
    }
    .kbd-hint {
      font-size: 10px; color: var(--muted); padding: 4px 8px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.12); white-space: nowrap;
    }
    .kbd-hint kbd {
      font-family: Consolas, monospace; font-size: 10px; color: var(--gold);
      padding: 1px 5px; border-radius: 3px; border: 1px solid rgba(245,197,66,.4);
      background: rgba(0,0,0,.35);
    }
    :focus { outline: none; }
    :focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(245, 197, 66, 0.28);
    }

    /* PET-UI-13 / MEDIA HUB: More tools collapse + workspace primary */
    :root {
      /* Theme-friendly aliases only — no second theme (kit --fafo-* floors remain) */
      --fafo-bg: var(--bg);
      --fafo-panel: var(--panel);
      --fafo-text: var(--text);
      --fafo-muted: var(--muted);
      --fafo-accent: var(--accent);
      --fafo-focus: var(--focus);
    }
    .hub-bar.fafo-toolbar { align-items: center; flex-wrap: wrap; }
    .hub-bar.fafo-toolbar details.fafo-collapse {
      position: relative; flex: 0 1 auto; min-width: 0; margin-top: 0; opacity: 1;
    }
    .hub-bar.fafo-toolbar details.fafo-collapse > summary {
      padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer;
      list-style: none; user-select: none; min-height: 0;
      border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--fafo-muted, var(--muted));
    }
    .hub-bar.fafo-toolbar details.fafo-collapse > summary::-webkit-details-marker { display: none; }
    .hub-bar.fafo-toolbar details.fafo-collapse[open] > summary {
      border-color: var(--fafo-accent, var(--accent)); color: var(--fafo-accent, var(--accent));
    }
    .hub-bar.fafo-toolbar details.fafo-collapse > :not(summary) {
      position: absolute; top: calc(100% + 4px); right: 0; z-index: 40;
      min-width: 260px; max-width: min(420px, 92vw); padding: 6px;
      background: var(--fafo-panel, var(--panel));
      border: 1px solid color-mix(in srgb, var(--fafo-accent, var(--accent)) 35%, transparent);
      border-radius: 10px; box-shadow: 0 12px 36px rgba(0,0,0,0.55);
    }
    .hub-more-body {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 2px;
    }
    .hub-tab.fafo-btn {
      /* Keep pill tabs; fafo-btn for kit/touch floors only */
      border-radius: 999px;
      background: transparent;
      min-height: 0;
      box-shadow: none;
    }
    .hub-tab.fafo-btn.active {
      background: rgba(0, 229, 255, 0.16);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    }
    .hub-actions .fafo-btn,
    .hub-more-body .fafo-btn {
      font-size: 11px; padding: 6px 10px; border-radius: 6px;
      text-decoration: none; font-weight: 600; cursor: pointer;
    }
    .hub-actions #btnStartServer.fafo-btn-primary {
      border-color: rgba(61,255,154,.45); color: var(--ok);
    }
    .frame-wrap [data-fafo-primary],
    #hubFrame[data-fafo-primary] {
      flex: 1 1 auto; min-height: 0; min-width: 0;
    }
    .frame-wrap.fafo-primary-surface,
    .frame-wrap [data-fafo-panel="workspace"][data-fafo-primary] {
      display: flex; flex-direction: column; flex: 1; min-height: 0; position: relative;
    }
    @media (max-width: 900px) {
      /* UI-M: hub-bar wraps; tabs stay tappable ≥44px */
      .hub-bar { gap: 6px; }
      .hub-tabs .hub-tab,
      .hub-tabs .hub-tab.fafo-btn {
        min-height: var(--fafo-touch-min, 44px);
        min-width: var(--fafo-touch-min, 44px);
        padding: 10px 14px;
      }
      .hub-meta { max-width: 100%; }
    }
    @media (max-width: 640px) {
      .hub-bar h1 { width: 100%; }
      .frame-wrap [data-fafo-primary] { min-height: 48vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <header class="hub-bar fafo-toolbar" data-fafo-toolbar>
    <!-- PET-UI-13 / MEDIA HUB: primary server/tabs/Start/Pop out + More tools overflow -->
    <h1>🗂️ MEDIA HUB</h1>
    <span class="server-badge" id="serverBadge" title="Toolbox server status">Server …</span>
    <div class="hub-tabs" id="hubTabs" role="tablist">
      <button type="button" class="hub-tab fafo-btn active" data-tab="library" role="tab" aria-selected="true" tabindex="0"
              data-tip-title="Library" data-tip="Browse, preview, tag, and search your media catalog.">Library</button>
      <button type="button" class="hub-tab fafo-btn" data-tab="duplicates" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Duplicates" data-tip="Find and clean duplicate files (full Duplicate Manager).">Duplicates</button>
      <button type="button" class="hub-tab fafo-btn" data-tab="organizer" role="tab" aria-selected="false" tabindex="-1"
              data-tip-title="Organizer" data-tip="Batch tag, rank, and rename catalog items.">Organizer</button>
    </div>
    <div class="hub-meta" id="hubMeta">Browse &amp; tag here · pair with <strong>Guided Match</strong> in Compare Hub · dups &amp; rename in tabs.</div>
    <div class="hub-actions">
      <span data-fafo-layout-toolbar></span>
      <button type="button" class="fafo-btn fafo-btn-primary" id="btnStartServer" data-legacy-server-chrome
              data-tip-title="Start Server" data-tip="Start the toolbox backend if offline (use top S1/S2 bar when shown).">▶ Start Server</button>
      <button type="button" class="fafo-btn" id="btnPopout" data-tip-title="Pop out" data-tip="Open this workspace in its own full window.">↗ Pop out</button>
      <details class="fafo-collapse" id="hubMoreTools" data-fafo-collapse-key="media-hub-more-tools">
        <summary>More tools</summary>
        <div class="hub-more-body">
          <a class="fafo-btn" href="../Toolbox Launcher.html" data-tip-title="Launcher" data-tip="Return to the main toolbox menu.">← Launcher</a>
          <a class="fafo-btn" href="Compare Hub.html#match" data-tip-title="Guided Match" data-tip="Process-of-elimination pairing with big previews and learning.">🎯 Guided Match</a>
          <a class="fafo-btn" href="Compare Hub.html" data-tip-title="Compare Hub" data-tip="Pair review + video/image comparators in one place.">⇄ Compare Hub</a>
          <a class="fafo-btn" href="VSR Pipeline Manager.html" data-tip-title="VSR" data-tip="Match and rename upscale / interpolation stages.">⚡ VSR</a>
          <button type="button" class="fafo-btn" id="btnCopyReport" data-tip-title="Report" data-tip="Copy a short hub status summary to the clipboard.">📋 Report</button>
          <span class="kbd-hint" title="Keyboard"><kbd>1</kbd> Lib · <kbd>2</kbd> Dups · <kbd>3</kbd> Org · <kbd>←</kbd><kbd>→</kbd> tabs · <kbd>R</kbd> report</span>
        </div>
      </details>
    </div>
  </header>
  <!-- Hub itself is a thin shell; Library / Duplicates / Organizer each save their own modular layouts -->
  <div class="frame-wrap fafo-primary-surface"
       data-fafo-layout-root
       data-fafo-layout-app="media-hub"
       data-fafo-layout-type="rows">
    <div data-fafo-panel="workspace" data-fafo-panel-title="Workspace" data-fafo-primary data-fafo-flex="1" class="fafo-primary-surface" style="display:flex;flex-direction:column;min-height:0;position:relative;flex:1">
    <div class="loading" id="loading">Loading workspace…</div>
    <iframe id="hubFrame" data-fafo-primary title="Media workspace" allow="autoplay; fullscreen" style="flex:1;border:0;width:100%;min-height:0"></iframe>
    </div>
  </div>

  <script src="../shared/aitoolbox-api.js?v=3.5.06"></script>
  <script src="../shared/aitoolbox-ui.js?v=3.5.06"></script>
  <script src="../shared/aitoolbox-layout.js?v=3.5.06"></script>
  <script src="../shared/aitoolbox-pro.js?v=3.5.06"></script>
  <script src="../shared/fafo-chrome.js?v=3.5.06"></script>
  <script>
    (function () {
      function el(id) {
        try { return document.getElementById(id); } catch (_) { return null; }
      }
      function setText(node, text) {
        if (!node) return;
        try { node.textContent = text == null ? '' : String(text); } catch (_) {}
      }
      function bind(node, ev, fn) {
        if (!node || !ev || typeof fn !== 'function') return;
        try { node.addEventListener(ev, fn); } catch (_) {}
      }
      function lsGet(key, fallback) {
        try {
          const v = localStorage.getItem(key);
          return v == null ? fallback : v;
        } catch (_) { return fallback; }
      }
      function lsSet(key, val) {
        try { localStorage.setItem(key, val); return true; } catch (_) { return false; }
      }
      function escHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function revokeBlobUrl(url) {
        try {
          if (url && String(url).indexOf('blob:') === 0) URL.revokeObjectURL(url);
        } catch (_) {}
      }
      const busyFlags = Object.create(null);
      async function withBusy(key, fn) {
        if (busyFlags[key]) return;
        busyFlags[key] = true;
        try { return await fn(); }
        catch (e) {
          try { window.AIToolboxUI?.toast?.(e?.message || String(e), 'warn'); } catch (_) {}
        } finally { busyFlags[key] = false; }
      }
      function isTypingTarget(t) {
        if (!t) return false;
        const tag = t.tagName || '';
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return true;
        if (t.isContentEditable) return true;
        return false;
      }

      const TABS = {
        library: {
          path: 'Media Library Manager.html',
          title: 'Media Library',
          meta: 'Catalog, preview, pair & search. Use <strong>Duplicates</strong> tab for full cleanup.'
        },
        duplicates: {
          path: '../File Tools/Duplicate File Manager.html',
          title: 'Duplicates',
          meta: 'Scan, compare, merge & recycle exact/near duplicates — same library server.'
        },
        organizer: {
          path: 'File Organizer.html',
          title: 'File Organizer',
          meta: 'Rename, tag, rank, merge same-named folders — metadata-first (no grid).'
        }
      };
      const TAB_ORDER = ['library', 'duplicates', 'organizer'];

      const frame = el('hubFrame');
      const loading = el('loading');
      const meta = el('hubMeta');
      const LS_TAB = 'fafo_media_hub_last_tab';
      let current = 'library';
      let loadTimer = null;
      let loadGen = 0;

      function normalizeTab(raw) {
        let h = String(raw || '').replace(/^#/, '').toLowerCase();
        h = h.split('?')[0].split('/')[0].trim();
        if (h === 'dupes' || h === 'duplicates' || h === 'duplicate') return 'duplicates';
        if (h === 'organizer' || h === 'org' || h === 'organize') return 'organizer';
        if (h === 'library' || h === 'lib') return 'library';
        if (TABS[h]) return h;
        return '';
      }

      function tabFromHash() {
        let h = (location.hash || '').replace(/^#/, '');
        if (!h) {
          try {
            const m = /#([^#]*)$/.exec(location.href || '');
            if (m) h = decodeURIComponent(m[1]);
          } catch (_) {}
        }
        const tab = normalizeTab(h);
        if (tab) return tab;
        if (!h || h === 'media') {
          const last = lsGet(LS_TAB, '');
          if (last && TABS[last]) return last;
        }
        return 'library';
      }

      function launcherHref() {
        try {
          if (window.AIToolboxUI?.launcherHref) return AIToolboxUI.launcherHref();
        } catch (_) {}
        return '../Toolbox Launcher.html';
      }

      function syncTabChrome(id) {
        document.querySelectorAll('.hub-tab').forEach((b) => {
          const on = b.dataset.tab === id;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', on ? 'true' : 'false');
          b.tabIndex = on ? 0 : -1;
        });
      }

      async function pingServer() {
        const badge = el('serverBadge');
        if (!badge) return;
        try {
          const on = await window.AIToolboxAPI?.isOnline?.(false, 1500).catch(() => false);
          setText(badge, on ? '● Online' : '○ Offline — click ▶ Start');
          badge.className = 'server-badge ' + (on ? 'ok' : 'bad');
          badge.title = on ? 'Toolbox server online' : 'Server offline — click to start from this page';
        } catch (_) {
          setText(badge, '○ Offline');
          badge.className = 'server-badge bad';
        }
      }

      async function startServerFromHub() {
        await withBusy('startServer', async () => {
          const btn = el('btnStartServer');
          if (btn) btn.disabled = true;
          try {
            window.AIToolboxUI?.toast?.('Starting toolbox server…', 'ok');
            if (window.AIToolboxAPI?.startServer) {
              await AIToolboxAPI.startServer({ mode: 'tray', waitMs: 90000 });
            } else {
              location.href = launcherHref();
              return;
            }
            await pingServer();
            window.AIToolboxUI?.toast?.('Server ready — reloading workspace', 'ok');
            showTab(current, false);
          } catch (e) {
            window.AIToolboxUI?.toast?.(e.message || 'Start failed — open Launcher', 'warn');
          } finally {
            if (btn) btn.disabled = false;
          }
        });
      }

      async function resolveSrc(tabId) {
        const t = TABS[tabId] || TABS.library;
        const path = t && t.path ? t.path : 'Media Library Manager.html';
        let toolboxPath = path.startsWith('../')
          ? path.replace(/^\.\.\//, '')
          : 'Movie File Manager/' + path;
        let src = path;
        try {
          if (window.AIToolboxAPI?.isOnline && window.AIToolboxAPI?.toolPageUrl) {
            const on = await AIToolboxAPI.isOnline(false, 1500).catch(() => false);
            if (on) src = AIToolboxAPI.toolPageUrl(toolboxPath) || src;
          }
        } catch (_) { /* ignore */ }
        if (tabId === 'duplicates' && location.search) {
          src += (String(src).includes('?') ? '&' : '?') + location.search.replace(/^\?/, '');
        }
        return src || path;
      }

      function showLoadFail(title, src) {
        if (!loading) return;
        loading.classList.remove('hide');
        loading.classList.add('fail');
        const safeTitle = escHtml(title);
        const safeSrc = escHtml(src);
        const safeLaunch = escHtml(launcherHref());
        loading.innerHTML =
          '<div><strong style="color:#fff">' + safeTitle + ' didn’t load</strong></div>' +
          '<div style="max-width:420px;color:var(--muted);font-size:12px;line-height:1.45">' +
          'The workspace tab timed out or failed. Retry, open it full-window, or return to the Launcher.</div>' +
          '<div class="actions">' +
          '<button type="button" id="hubRetry">↻ Retry</button>' +
          '<a href="' + safeSrc + '" target="_blank" rel="noopener">↗ Open full window</a>' +
          '<a class="ghost" href="' + safeLaunch + '">← Launcher</a>' +
          '<button type="button" class="ghost" id="hubStartFromFail">▶ Start Server</button>' +
          '</div>';
        bind(el('hubRetry'), 'click', () => showTab(current, false));
        bind(el('hubStartFromFail'), 'click', startServerFromHub);
      }

      async function showTab(id, pushHash) {
        await (async () => {
          if (!TABS[id]) id = 'library';
          current = id;
          syncTabChrome(id);
          const t = TABS[id] || TABS.library;
          document.title = (t.title || 'Media') + ' — Media Hub';
          if (meta) meta.innerHTML = t.meta || '';
          lsSet(LS_TAB, id);
          if (pushHash !== false) {
            const hash = id === 'library' ? 'library' : id;
            if ((location.hash || '').replace(/^#/, '') !== hash) {
              try { history.replaceState(null, '', '#' + hash); } catch (_) {}
            }
          }
          if (!frame || !loading) return;
          const gen = ++loadGen;
          if (loadTimer) clearTimeout(loadTimer);
          loading.classList.remove('hide', 'fail');
          setText(loading, 'Loading ' + (t.title || 'workspace') + '…');
          const src = await resolveSrc(id);
          frame.onload = () => {
            if (gen !== loadGen) return;
            if (loadTimer) clearTimeout(loadTimer);
            loading.classList.add('hide');
            loading.classList.remove('fail');
          };
          frame.onerror = () => {
            if (gen !== loadGen) return;
            if (loadTimer) clearTimeout(loadTimer);
            showLoadFail(t.title, src);
          };
          loadTimer = setTimeout(() => {
            if (gen !== loadGen) return;
            if (loading.classList.contains('hide')) return;
            try {
              const doc = frame.contentDocument;
              if (doc && (doc.readyState === 'complete' || doc.readyState === 'interactive')) {
                loading.classList.add('hide');
                return;
              }
            } catch (_) {
              if (frame.getAttribute('src')) {
                loading.classList.add('hide');
                return;
              }
            }
            showLoadFail(t.title, src);
          }, 25000);
          try {
            revokeBlobUrl(frame.getAttribute('src'));
          } catch (_) {}
          frame.src = src;
        });
      }

      async function copyHubReport() {
        await withBusy('copyReport', async () => {
          const t = TABS[current] || TABS.library;
          const lines = [
            'FAFO Media Hub — session report',
            'Time: ' + new Date().toISOString(),
            'Active tab: ' + (t.title || current),
            'Hash: ' + (location.hash || '#library'),
            'URL: ' + location.href,
            'Server: ' + (el('serverBadge')?.textContent || 'unknown'),
            '',
            'Counterparts: Compare Hub · Guided Match · VSR · Duplicates · Organizer',
          ];
          const text = lines.join('\n');
          try {
            await navigator.clipboard.writeText(text);
            window.AIToolboxUI?.toast?.('Hub report copied', 'ok');
          } catch (_) {
            try { prompt('Copy report:', text); } catch (__) {}
          }
        });
      }

      function focusTabByOffset(delta) {
        const i = Math.max(0, TAB_ORDER.indexOf(current));
        let n = i + delta;
        if (n < 0) n = TAB_ORDER.length - 1;
        if (n >= TAB_ORDER.length) n = 0;
        const next = TAB_ORDER[n];
        showTab(next, true);
        const btn = document.querySelector('.hub-tab[data-tab="' + next + '"]');
        try { btn?.focus(); } catch (_) {}
      }

      bind(el('hubTabs'), 'click', (e) => {
        const btn = e.target && e.target.closest ? e.target.closest('.hub-tab') : null;
        if (!btn || !btn.dataset.tab) return;
        showTab(btn.dataset.tab, true);
      });
      bind(el('hubTabs'), 'keydown', (e) => {
        if (!e) return;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); focusTabByOffset(1); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); focusTabByOffset(-1); }
        else if (e.key === 'Home') { e.preventDefault(); showTab(TAB_ORDER[0], true); }
        else if (e.key === 'End') { e.preventDefault(); showTab(TAB_ORDER[TAB_ORDER.length - 1], true); }
      });

      bind(el('btnPopout'), 'click', () => {
        withBusy('popout', async () => {
          const src = await resolveSrc(current);
          try { window.open(src, '_blank'); } catch (_) {}
        });
      });
      bind(el('btnCopyReport'), 'click', copyHubReport);
      bind(el('btnStartServer'), 'click', startServerFromHub);
      bind(el('serverBadge'), 'click', () => {
        const badge = el('serverBadge');
        if (badge && badge.classList.contains('bad')) startServerFromHub();
        else pingServer();
      });

      window.addEventListener('hashchange', () => showTab(tabFromHash(), false));
      window.addEventListener('pageshow', (e) => {
        if (e.persisted) showTab(tabFromHash(), false);
      });

      showTab(tabFromHash(), true);
      pingServer();
      setInterval(pingServer, 20000);
      document.addEventListener('keydown', function hubTabKeys(e){
        if (isTypingTarget(e.target)) return;
        const map = { '1':'library', '2':'duplicates', '3':'organizer' };
        if (map[e.key]) { e.preventDefault(); showTab(map[e.key], true); }
        if (e.key === 'r' || e.key === 'R') { e.preventDefault(); copyHubReport(); }
      });
      window.addEventListener('message', function (ev) {
        const data = ev?.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'fafo-hub-tab') {
          const tab = normalizeTab(data.tab);
          if (!tab) return;
          if (data.search && String(data.search).startsWith('?')) {
            try { history.replaceState(null, '', data.search + '#' + tab); } catch (_) {}
          }
          showTab(tab, true);
          return;
        }
        if (data.type === 'fafo-escape') {
          try {
            location.href = (window.AIToolboxUI?.launcherHref?.() || data.href || '../Toolbox Launcher.html');
          } catch (_) {
            location.href = '../Toolbox Launcher.html';
          }
        }
      });
    })();
  </script>

<script data-tool-polish="media-hub">
/* Tool polish: media-hub — Esc → launcher (shared UI owns layered Esc), load toast */
(function(){
  if (window.__tbToolPolish) return; window.__tbToolPolish = true;
  const TOOL_ID = "media-hub";
  const TOOL_NAME = "Media Hub";
  function launcherHref(){
    try {
      if (window.AIToolboxUI?.launcherHref) return AIToolboxUI.launcherHref();
      if (location.hostname === '127.0.0.87' || location.port === '18765')
        return 'http://127.0.0.87:18765/toolbox/Toolbox%20Launcher.html';
    } catch(_){}
    const a = document.querySelector('a[href*="Toolbox Launcher"], a.toolbox-back');
    if (a?.href) return a.href;
    return '../Toolbox Launcher.html';
  }
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    if (window.AIToolboxUI?.bindEscToLauncher) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;
    if (t?.closest?.('[role="dialog"], .modal, .overlay, .ui-modal')) return;
    location.href = launcherHref();
  }, true);
  window.addEventListener('load', function(){
    try {
      if (sessionStorage.getItem('tb_launch_toast_'+TOOL_ID)) return;
      sessionStorage.setItem('tb_launch_toast_'+TOOL_ID, '1');
      if (window.AIToolboxUI?.toast) AIToolboxUI.toast(TOOL_NAME + ' ready · Esc = launcher', 'ok');
    } catch(_){}
  });
  window.addEventListener('error', function(ev){
    if (!ev?.filename || !/\.js($|\?)/i.test(ev.filename)) return;
    try { window.AIToolboxUI?.toast?.('Script failed: ' + (ev.message||'error').slice(0,80), 'warn'); } catch(_){}
  });
})();
</script>
