<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="ROG Maximus Z790 Hero rear I/O schematic">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2336"/>
      <stop offset="100%" stop-color="#0d121c"/>
    </linearGradient>
    <style>
      .label { font: 600 11px Segoe UI, system-ui, sans-serif; fill: #8b9bb4; }
      .title { font: 700 13px Segoe UI, system-ui, sans-serif; fill: #e2e8f0; }
      .port { cursor: pointer; }
      .port:hover .face { stroke: #00f3ff; stroke-width: 2; }
      .port.active .face { stroke: #fbbf24; stroke-width: 2.5; }
      .face { fill: #0b1220; stroke: #3b4d6b; stroke-width: 1.2; }
      .usb2 { fill: #1e293b; }
      .usb3 { fill: #0e3a4a; stroke: #22d3ee; }
      .usbc { fill: #1a1030; stroke: #a78bfa; }
      .eth { fill: #0f2918; stroke: #34d399; }
      .vid { fill: #1a1a2e; stroke: #60a5fa; }
      .btn { fill: #2a1520; stroke: #f43f5e; }
      .ant { fill: #111827; stroke: #94a3b8; }
      .audio { fill: #1f2937; stroke: #c084fc; }
    </style>
  </defs>

  <!-- Chassis bar -->
  <rect x="8" y="28" width="944" height="164" rx="10" fill="url(#panel)" stroke="#243049" stroke-width="2"/>
  <text x="20" y="20" class="title">Rear I/O · ROG Maximus Z790 Hero (schematic)</text>
  <text x="640" y="20" class="label">Click a port for details · not a photo of every PCB rev</text>

  <!-- BIOS FlashBack -->
  <g class="port" data-port="bios-flashback" transform="translate(28,70)">
    <circle class="face btn" cx="14" cy="40" r="12"/>
    <text x="0" y="78" class="label">FlashBack</text>
  </g>

  <!-- Clear CMOS -->
  <g class="port" data-port="clear-cmos" transform="translate(70,70)">
    <circle class="face btn" cx="14" cy="40" r="12"/>
    <text x="0" y="78" class="label">CLR_CMOS</text>
  </g>

  <!-- WiFi antennas -->
  <g class="port" data-port="wifi-ant" transform="translate(118,55)">
    <rect class="face ant" x="0" y="8" width="22" height="90" rx="4"/>
    <rect class="face ant" x="28" y="8" width="22" height="90" rx="4"/>
    <text x="0" y="118" class="label">Wi‑Fi</text>
  </g>

  <!-- HDMI + DP -->
  <g class="port" data-port="hdmi" transform="translate(190,78)">
    <rect class="face vid" width="48" height="28" rx="3"/>
    <text x="8" y="52" class="label">HDMI</text>
  </g>
  <g class="port" data-port="dp" transform="translate(250,78)">
    <rect class="face vid" width="44" height="28" rx="3"/>
    <text x="10" y="52" class="label">DP</text>
  </g>

  <!-- USB 2.0 stack -->
  <g class="port" data-port="usb-a-2-top" transform="translate(320,55)">
    <rect class="face usb2" width="28" height="18" rx="2"/>
    <rect class="face usb2" x="0" y="24" width="28" height="18" rx="2"/>
    <text x="-4" y="62" class="label">USB 2.0</text>
  </g>
  <g class="port" data-port="usb-a-2-bot" transform="translate(320,120)">
    <rect class="face usb2" width="28" height="18" rx="2"/>
    <rect class="face usb2" x="0" y="24" width="28" height="18" rx="2"/>
    <text x="-4" y="62" class="label">USB 2.0</text>
  </g>

  <!-- Thunderbolt USB-C -->
  <g class="port" data-port="usb-c-tb" transform="translate(380,88)">
    <rect class="face usbc" width="36" height="14" rx="7"/>
    <text x="-8" y="38" class="label">TB / USB-C</text>
  </g>

  <!-- USB-A 3.2 -->
  <g class="port" data-port="usb-a-32-gen2" transform="translate(440,70)">
    <rect class="face usb3" width="28" height="18" rx="2"/>
    <rect class="face usb3" x="0" y="24" width="28" height="18" rx="2"/>
    <rect class="face usb3" x="0" y="48" width="28" height="18" rx="2"/>
    <text x="-6" y="88" class="label">USB 3.2 A</text>
  </g>

  <!-- USB-C 3.2 -->
  <g class="port" data-port="usb-c-32" transform="translate(500,88)">
    <rect class="face usbc" width="36" height="14" rx="7"/>
    <text x="0" y="38" class="label">USB-C</text>
  </g>

  <!-- More USB-A -->
  <g class="port" data-port="usb-a-32-right" transform="translate(560,70)">
    <rect class="face usb3" width="28" height="18" rx="2"/>
    <rect class="face usb3" x="0" y="24" width="28" height="18" rx="2"/>
    <rect class="face usb3" x="0" y="48" width="28" height="18" rx="2"/>
    <text x="-6" y="88" class="label">USB 3.2 A</text>
  </g>

  <!-- Ethernet -->
  <g class="port" data-port="eth" transform="translate(630,78)">
    <rect class="face eth" width="42" height="36" rx="3"/>
    <text x="4" y="58" class="label">2.5G LAN</text>
  </g>

  <!-- Optical -->
  <g class="port" data-port="optical" transform="translate(700,88)">
    <circle class="face audio" cx="12" cy="10" r="10"/>
    <text x="-6" y="38" class="label">S/PDIF</text>
  </g>

  <!-- Audio jacks -->
  <g class="port" data-port="audio-jacks" transform="translate(750,70)">
    <circle class="face audio" cx="14" cy="14" r="10"/>
    <circle class="face audio" cx="44" cy="14" r="10"/>
    <circle class="face audio" cx="74" cy="14" r="10"/>
    <circle class="face audio" cx="14" cy="48" r="10"/>
    <circle class="face audio" cx="44" cy="48" r="10"/>
    <circle class="face audio" cx="74" cy="48" r="10"/>
    <text x="20" y="80" class="label">Audio</text>
  </g>

  <!-- Legend -->
  <g transform="translate(28,200)">
    <rect width="10" height="10" fill="#1e293b" stroke="#3b4d6b"/><text x="14" y="9" class="label">USB 2.0</text>
    <rect x="80" width="10" height="10" fill="#0e3a4a" stroke="#22d3ee"/><text x="94" y="9" class="label">USB 3.x</text>
    <rect x="160" width="10" height="10" fill="#1a1030" stroke="#a78bfa"/><text x="174" y="9" class="label">USB-C / TB</text>
    <rect x="260" width="10" height="10" fill="#0f2918" stroke="#34d399"/><text x="274" y="9" class="label">Ethernet</text>
  </g>
</svg>
