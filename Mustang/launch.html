<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FAFO Auto Technician</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10161c; color: #f2efe6; font: 18px/1.45 Segoe UI, sans-serif; }
    main { max-width: 34rem; padding: 24px; }
    a { color: #e8a42c; }
  </style>
</head>
<body>
  <main>
    <p id="m">Starting FAFO Auto Technician…</p>
  </main>
  <script>
    (function () {
      var msg = document.getElementById('m');
      var host = location.hostname;
      var onLan = location.protocol.indexOf('http') === 0 && host && host !== '127.0.0.1' && host !== 'localhost';
      var shop = onLan ? (location.protocol + '//' + host + ':8080/?shop=1') : 'http://127.0.0.1:8080/?shop=1';
      fetch('http://127.0.0.87:18765/api/tools/launch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: 'fafo-auto-tech', action: 'run' })
      }).then(function (r) {
        if (!r.ok) throw new Error('launch failed');
        msg.textContent = 'FAFO Auto Technician is opening.';
        if (onLan) location.href = shop;
      }).catch(function () {
        msg.innerHTML = 'The toolbox server did not start it. On this PC, open the <strong>FAFO Auto Technician</strong> shortcut on the Desktop. To change that shortcut icon, right-click it, choose Properties, then Change Icon. Or run Change-FAFO-Auto-Tech-Icon.bat in the toolbox folder.';
      });
    })();
  </script>
</body>
</html>
