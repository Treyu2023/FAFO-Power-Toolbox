<!DOCTYPE html>
<html lang="en" data-fafo-app="mustang">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0d">
  <meta name="aitoolbox-tool-id" content="mustang">
  <title>Mustang — 2001 coupe 3.8 · FAFO Toolbox</title>
  <link rel="icon" href="../shared/pwa/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/fafo-chrome.css">
  <link rel="stylesheet" href="mustang.css">
  <style>
    html, body, #root { height: 100%; margin: 0; background: #0c0c0d; }
    #toolbox-back {
      position: fixed;
      z-index: 40;
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(12px + env(safe-area-inset-bottom));
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid #3a3a40;
      background: rgba(12, 12, 13, 0.92);
      color: #f4f4f5;
      font: 600 13px system-ui, "Segoe UI", Roboto, sans-serif;
      text-decoration: none;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    #toolbox-back:hover { border-color: #f4f4f5; }
  </style>
</head>
<body>
  <div id="root"></div>
  <a id="toolbox-back" href="../Toolbox%20Launcher.html">Toolbox</a>
  <script src="../shared/fafo-chrome.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
