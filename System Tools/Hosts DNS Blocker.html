<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Hosts & DNS Blocker — AI HTML Toolbox</title>
<link rel="stylesheet" href="../shared/aitoolbox-ui.css">
<style>
:root{--bg:#050508;--panel:#0c0f16;--border:rgba(56,189,248,.2);--accent:#38bdf8;--ok:#4ade80;--text:#e2e8f0;--muted:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 50% -20%,#0c1929,var(--bg) 60%);color:var(--text);min-height:100vh}
.nav{display:flex;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border)}
.nav a{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.wrap{max-width:900px;margin:0 auto;padding:24px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:16px;overflow:hidden}
.ph{padding:14px 18px;border-bottom:1px solid var(--border);color:var(--accent);font-size:12px;text-transform:uppercase}
.pb{padding:16px 18px}
.btn{padding:8px 16px;border:1px solid var(--accent);background:rgba(56,189,248,.1);color:var(--accent);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;margin-right:8px}
.btn.off{border-color:rgba(248,113,113,.4);color:#f87171;background:rgba(248,113,113,.08)}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;width:100%;margin-bottom:8px}
.sel{background:rgba(0,0,0,.3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px}
.stat{display:inline-block;padding:6px 12px;border-radius:8px;background:rgba(56,189,248,.1);font-size:12px;margin-right:8px}
.mono{font-family:Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.feed{padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer}
.feed:hover{border-color:var(--accent)}
.feed.active{border-color:var(--accent);background:rgba(56,189,248,.08)}
</style>
</head>
<body>
<nav class="nav"><a href="../Toolbox Launcher.html">← Toolbox</a><span style="color:var(--accent)">HOSTS & DNS BLOCKER</span></nav>
<div class="wrap">
<h1 style="font-size:22px;margin-bottom:4px">Hosts & DNS Blocker</h1>
<p style="color:var(--muted);font-size:13px;margin-bottom:16px">Block ads, trackers, and malware domains using open Steven Black hosts feeds. Updates your Windows hosts file.</p>
<div id="adminWarn" style="display:none;padding:12px;border-radius:10px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fcd34d;font-size:13px;margin-bottom:16px">⚠ Run server as Administrator to modify the hosts file.</div>
<div class="pb" style="padding:0 0 16px" id="statusBar"></div>
<div class="panel"><div class="ph">Blocklist feeds (open source)</div><div class="pb" id="feeds"></div></div>
<div class="panel"><div class="ph">Actions</div><div class="pb">
<button class="btn" id="btnEnable">Enable blocklist</button>
<button class="btn off" id="btnDisable">Disable blocklist</button>
</div></div>
<div class="panel"><div class="ph">Custom block</div><div class="pb">
<input class="inp" id="customHost" placeholder="domain.com">
<button class="btn" id="btnAdd">Add to hosts</button>
</div></div>
<div class="panel"><div class="ph">Hosts file</div><div class="pb mono" id="hostsPreview" style="max-height:200px;overflow:auto">Loading…</div></div>
</div>
<script src="../shared/aitoolbox-config.js"></script>
<script src="../shared/aitoolbox-version.js"></script>
<script src="../shared/aitoolbox-debug.js"></script>
<script src="../shared/aitoolbox-api.js"></script>
<script src="../shared/aitoolbox-ui.js"></script>
<script>
const API = (window.AITOOLBOX_CONFIG && AITOOLBOX_CONFIG.API_BASE) || window.AITOOLBOX_API_BASE || 'http://127.0.0.87:18765/api';
let feedId='ads';
async function api(p,o={}){const r=await fetch(API+p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.detail||r.statusText)}return r.json()}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function load(){
  const st=await api('/hosts/status');
  document.getElementById('statusBar').innerHTML=`<span class="stat">${st.blocklist_enabled?'🟢 Blocklist ON':'⚪ Blocklist OFF'}</span><span class="stat">${(st.blocklist_count||0).toLocaleString()} blocked domains</span><span class="stat">${st.custom_count} custom</span>`;
  document.getElementById('feeds').innerHTML=st.feeds.map(f=>`<div class="feed ${f.id===feedId?'active':''}" data-id="${f.id}"><strong>${esc(f.name)}</strong><div style="font-size:11px;color:var(--muted);margin-top:4px">${esc(f.description)}</div></div>`).join('');
  document.querySelectorAll('.feed').forEach(el=>el.onclick=()=>{feedId=el.dataset.id;load()});
  const h=await api('/hosts/read');
  document.getElementById('hostsPreview').textContent=(h.raw||'').slice(0,3000)+(h.raw?.length>3000?'\n…':'');
}
document.getElementById('btnEnable').onclick=async()=>{try{const r=await api('/hosts/apply',{method:'POST',body:JSON.stringify({feed_id:feedId,enabled:true})});alert('Enabled '+r.blocklist_count+' entries')}catch(e){document.getElementById('adminWarn').style.display='block';alert(e.message)}load()};
document.getElementById('btnDisable').onclick=async()=>{await api('/hosts/apply',{method:'POST',body:JSON.stringify({feed_id:feedId,enabled:false})});load()};
document.getElementById('btnAdd').onclick=async()=>{const host=document.getElementById('customHost').value.trim();if(!host)return;try{await api('/hosts/add',{method:'POST',body:JSON.stringify({host})})}catch(e){alert(e.message)}load()};
load();
</script>
<script>

// Shared server start (injected polish)
(function(){
  const ep = () => (window.AITOOLBOX_CONFIG && AITOOLBOX_CONFIG.ENDPOINT_LABEL) || '127.0.0.87:18765';
  function ensureBar(){
    if (document.getElementById('tbSharedServerBar')) return;
    const bar = document.createElement('div');
    bar.id = 'tbSharedServerBar';
    bar.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid rgba(0,243,255,.15);background:rgba(0,0,0,.35);font-size:12px;';
    bar.innerHTML = '<span id="tbServerPill" style="padding:3px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.15);cursor:pointer">Server …</span>'
      + '<button type="button" id="tbBtnStartServer" style="padding:5px 12px;border-radius:8px;border:1px solid #00f3ff;background:rgba(0,243,255,.12);color:#00f3ff;cursor:pointer;font-weight:600">▶ Start Server</button>'
      + '<span id="tbServerHint" style="color:#888;font-size:11px"></span>'
      + '<span style="margin-left:auto;opacity:.55;font-size:11px" id="tbVer"></span>';
    const nav = document.querySelector('nav, .nav, .nav-bar, header');
    if (nav && nav.parentNode) nav.parentNode.insertBefore(bar, nav.nextSibling);
    else document.body.insertBefore(bar, document.body.firstChild);
    if (window.AITOOLBOX_VERSION) document.getElementById('tbVer').textContent = 'v' + window.AITOOLBOX_VERSION;
    if (window.AIToolboxUI && AIToolboxUI.bindServerControls) {
      AIToolboxUI.bindServerControls({ statusEl: '#tbServerPill', startBtn: '#tbBtnStartServer', hintEl: '#tbServerHint' });
      if (AIToolboxUI.initTooltips) AIToolboxUI.initTooltips();
    } else {
      const pill = document.getElementById('tbServerPill');
      const btn = document.getElementById('tbBtnStartServer');
      const hint = document.getElementById('tbServerHint');
      async function refresh(){
        const on = window.AIToolboxAPI ? await AIToolboxAPI.isOnline(true) : false;
        pill.textContent = on ? ('● Online @ ' + ep()) : '○ Offline — click Start';
        pill.style.color = on ? '#4ade80' : '#fbbf24';
        btn.style.display = on ? 'none' : '';
        hint.textContent = on ? '' : ('Backend ' + ep() + ' (not FAFO :8765)');
      }
      btn.onclick = async () => {
        if (!window.AIToolboxAPI) return;
        btn.disabled = true; btn.textContent = 'Starting…';
        const r = await AIToolboxAPI.startServer({ mode: 'tray', waitMs: 90000 });
        btn.disabled = false; btn.textContent = '▶ Start Server';
        await refresh();
        if (!r.ok) alert('Start failed — try START SERVER.bat in the toolbox folder');
      };
      pill.onclick = () => btn.click();
      refresh(); setInterval(refresh, 8000);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ensureBar);
  else ensureBar();
})();

</script>
</body>
</html>
