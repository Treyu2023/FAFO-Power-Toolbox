<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Neon Ninja Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Syne:wght@700&display=swap"/>
<style>
:root{--bg:#07060c;--surface:#14121c;--fg:#f4efe6;--muted:#a39890;--primary:#3ef0ff;--accent:#ff3d9a;--line:#322c44;--good:#5ee9b5;color-scheme:dark}
[data-theme=ember]{--bg:#140c09;--surface:#241510;--fg:#f8efe6;--muted:#c4a898;--primary:#ffb25a;--accent:#ff4d3a;--line:#3a241c;--good:#f6d37a}
[data-theme=glacier]{--bg:#071018;--surface:#10202c;--fg:#e7f4f8;--muted:#93b0be;--primary:#7dfff2;--accent:#8eb6ff;--line:#1c3344;--good:#b6f3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Outfit,Segoe UI,sans-serif}
body{min-height:100vh;background:radial-gradient(900px 420px at 0% -10%,color-mix(in oklab,var(--primary) 18%,transparent),transparent 55%),radial-gradient(720px 380px at 100% 0%,color-mix(in oklab,var(--accent) 14%,transparent),transparent 50%),repeating-linear-gradient(118deg,transparent 0 22px,color-mix(in oklab,var(--fg) 4%,transparent) 23px,transparent 26px),var(--bg)}
h1,h2,strong{font-family:Syne,Outfit,sans-serif}h1{font-size:1.8rem;line-height:1;margin:0}h2{margin:0;font-size:1.2rem}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
#app{max-width:1440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel{background:color-mix(in oklab,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:16px;padding:14px}
.head{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kicker{margin:0;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);font-size:11px}
.grow{flex:1;min-width:200px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:color-mix(in oklab,var(--bg) 70%,transparent);padding:0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.scroll{flex-wrap:nowrap;overflow:auto}
.chip{min-height:44px;border-radius:999px;border:1px solid var(--line);background:transparent;padding:0 12px;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--bg);border-color:transparent}
.pulse{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.pulse p{margin:0;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr);gap:12px}
svg{width:100%;height:auto;display:block;background:color-mix(in oklab,var(--bg) 80%,black);border-radius:12px}
path{cursor:pointer}.bloom{filter:blur(7px);mix-blend-mode:screen}
.legend{height:10px;border-radius:99px;margin-top:8px;background:linear-gradient(90deg,#16082c,#1d4ed8,#3ef0ff,#ffe27a,#ff3d9a)}
.legend.compare{background:linear-gradient(90deg,var(--primary),#241c33,var(--accent))}
.note{color:var(--muted);font-size:12px;line-height:1.45}
.emblem{width:56px;height:56px;border-radius:16px;object-fit:cover;border:1px solid var(--line)}
.big{font-size:1.6rem}
.split{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:8px 0}.sl input{grid-column:1/-1;width:100%;accent-color:var(--primary);height:28px}
.pack{display:flex;gap:8px;overflow:auto;margin:8px 0}.pack article{min-width:150px;border:1px solid var(--line);border-radius:12px;padding:8px}
.board-wrap{max-height:480px;overflow:auto}table.board{width:100%;border-collapse:collapse;font-size:14px}
.board th{position:sticky;top:0;text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface);padding:8px 6px}
.board td{border-top:1px solid var(--line);padding:8px 6px}.board tr.on td{background:color-mix(in oklab,var(--primary) 12%,transparent)}
button.link{background:none;border:0;color:inherit;text-align:left;min-height:44px;padding:0}
.good{color:var(--good)}.bad{color:var(--accent)}
select{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 8px}
@media(max-width:900px){.grid,.pulse{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}

</style>
</head>

  const paths = SHAPES.map(([iso, d]) => {
    const c = byIso.get(iso);
    let fill = rampSet.empty;
    if (c && state.chloro) {
      const v = val(c);
      if (v != null && compare) {
        const t = clamp(Math.log2(Math.max(v / compare, 0.02)), -1, 1);
        fill = diverging(m.lower ? -t : t, rampSet);
      } else if (v != null) fill = ramp(rampSet.heat, m.lower ? 1 - scaleT(v, bag, m.log) : scaleT(v, bag, m.log));
    }
    const dim = state.region !== "All" && c && c.region !== state.region ? 0.28 : 1;
    const hot = c && (c.id === state.focus || state.pins.includes(c.id));
    return `<path data-iso="${iso}" d="${d}" fill="${fill}" opacity="${dim}" stroke="${hot ? "var(--accent)" : "var(--fg)"}" stroke-opacity="${hot ? 1 : 0.22}" stroke-width="${hot ? 1.5 : 0.45}"></path>`;
  }).join("");
  const blobs = state.heat ? DATA.countries.map((c) => {
    if (state.region !== "All" && c.region !== state.region) return "";
    const v = val(c); if (v == null) return "";
    const [x, y] = xy(c); const r = Math.min(78, Math.max(16, 10 + Math.sqrt(c.area || 1) / 48));
    const t = scaleT(v, bag, m.log);
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${ramp(rampSet.heat, m.lower ? 1 - t : t)}"/>`;
  }).join("") : "";
  const rings = state.ghost ? DATA.countries.map((c) => {
    const s = scen.get(c.id); const v = valueOf(ghost, c, s); if (v == null) return "";
    const [x, y] = xy(c);
    const gv = DATA.countries.map((cc) => valueOf(ghost, cc, scen.get(cc.id))).filter((n) => n != null);
    return `<circle cx="${x}" cy="${y}" r="${Math.min(40, 8 + Math.sqrt(c.area || 1) / 80)}" fill="none" stroke="${ramp(rampSet.heat, ghost.lower ? 1 - scaleT(v, gv, ghost.log) : scaleT(v, gv, ghost.log))}" stroke-width="1.2"/>`;
  }).join("") : "";
  const chips = (items, cur, act) => items.map((it) => `<button class="chip ${cur === it ? "on" : ""}" data-act="${act}" data-id="${esc(it)}">${esc(it === "marble" ? "Marble neon" : it === "ember" ? "Ember" : it === "glacier" ? "Glacier" : it)}</button>`).join("");
  const focusRank = list.map((c) => ({ c, v: val(c) })).filter((r) => r.v != null).sort((a, b) => m.lower ? a.v - b.v : b.v - a.v);
  const ri = focusRank.findIndex((r) => r.c.id === focus.id);
  app.innerHTML = `
    <header class="panel head">
      <img class="emblem" alt="Neon ninja marble mask" src="data:image/jpeg;base64,${document.getElementById("emblem").textContent.trim()}"/>
      <div><p class="kicker">Neon Ninja</p><h1>Atlas</h1></div>
      <input id="q" class="grow" placeholder="Search country, capital, ISO" value="${esc(state.query)}"/>
      <div class="row">${chips(["marble", "ember", "glacier"], state.theme, "theme")}${dirty() ? `<span class="chip on">Scenario live</span>` : ""}</div>
    </header>
    <section class="pulse panel">
      <div><p>Births / day</p><strong>${compact(births / YEAR)}</strong></div>
      <div><p>Deaths / day</p><strong>${compact(deaths / YEAR)}</strong></div>
      <div><p>World GDP / hour</p><strong>$${compact(gdp / (YEAR * 24))}</strong></div>
      <div><p>People</p><strong>${compact(pop)}</strong></div>
    </section>
    <p class="note">${born >= 1 ? compact(born) + " births worldwide since you opened this atlas." : "Live birth counter starts a second after open."}</p>
    <nav class="row">${["All", "Africa", "Americas", "Asia", "Europe", "Oceania"].map((r) => `<button class="chip ${state.region === r ? "on" : ""}" data-act="region" data-id="${r}">${r}</button>`).join("")}</nav>
    <div class="row">${GROUPS.map((g) => `<button class="chip ${state.group === g ? "on" : ""}" data-act="group" data-id="${g}">${g}</button>`).join("")}</div>
    <div class="row scroll">${METRICS.filter((x) => x.group === state.group).map((x) => `<button class="chip ${state.metric === x.id ? "on" : ""}" data-act="metric" data-id="${x.id}">${x.label}</button>`).join("")}</div>
    <div class="row">
      <button class="chip ${state.lens === "nominal" ? "on" : ""}" data-act="lens" data-id="nominal">Nominal</button>
      <button class="chip ${state.lens === "ppp" ? "on" : ""}" data-act="lens" data-id="ppp">Per capita PPP</button>
      ${["year", "day", "hour", "sec"].map((r) => `<button class="chip ${state.rate === r ? "on" : ""}" data-act="rate" data-id="${r}">/ ${r}</button>`).join("")}
    </div>
    <div class="grid">
      <section class="panel">
        <div class="split"><div><p class="kicker">${compare != null ? "Compare heat" : "Heat field"}</p><h2>${m.label}</h2></div>
          <div class="row"><button class="chip ${state.mode === "explore" ? "on" : ""}" data-act="mode" data-id="explore">Explore</button><button class="chip ${state.mode === "pin" ? "on" : ""}" data-act="mode" data-id="pin">Pin on map</button></div></div>
        <div class="row">
          <button class="chip ${state.chloro ? "on" : ""}" data-act="flag" data-id="chloro">Choropleth</button>
          <button class="chip ${state.heat ? "on" : ""}" data-act="flag" data-id="heat">Heat bloom</button>
          <button class="chip ${state.ghost ? "on" : ""}" data-act="flag" data-id="ghost">Ghost overlay</button>
          <button class="chip ${state.pulse ? "on" : ""}" data-act="flag" data-id="pulse">Vital pulse</button>
        </div>
        <label class="note">Ghost <select id="ghost">${METRICS.map((x) => `<option value="${x.id}" ${x.id === state.ghostId ? "selected" : ""}>${x.label}</option>`).join("")}</select></label>
        <svg viewBox="0 0 960 480" id="map">${paths}<g class="bloom" opacity="${state.alpha}">${blobs}</g>${rings}</svg>
        <div class="legend ${compare != null ? "compare" : ""}"></div>
        <p class="note">${compare != null ? "Pinned pack is the baseline. Cyan is below it, magenta is above. Lower-is-better stats flip that so magenta still means better." : "Fills are the statistic. Bloom is a kernel on each capital. Rings are the ghost metric."}</p>
      </section>
      <section class="panel">
        <p class="kicker">${focus.iso3} · ${esc(focus.subregion)}</p>
        <div class="split"><h2>${focus.flag} ${esc(focus.name)}</h2><button class="chip" data-act="toggle-pin" data-id="${focus.id}">${state.pins.includes(focus.id) ? "Unpin" : "Pin baseline"}</button></div>
        <p class="note" id="sky">${esc(focus.capital)} · reading the sky…</p>
        <p class="kicker">${m.label}${m.scalable ? " / " + state.rate : ""}</p>
        <strong class="big">${present(m, val(focus))}</strong>
        <p class="note">${ri < 0 ? "Outside this filter" : "Rank " + (ri + 1) + " of " + focusRank.length}. Household and rates move with the sliders.</p>
        <div class="pulse">
          <div><p>Population</p><strong>${compact(fs.pop)}</strong></div>
          <div><p>GDP / ${state.rate}</p><strong>${present(metricOf("gdp"), fs.gdp)}</strong></div>
          <div><p>Household / ${state.rate}</p><strong>${present(metricOf("household"), fs.household)}</strong></div>
          <div><p>Births / ${state.rate}</p><strong>${present(metricOf("birthsYear"), fs.birthsYear)}</strong></div>
        </div>
        ${slider("Horizon", "years", 0, 40, 1, " yr")}
        ${slider("Fertility", "fertility", 0.6, 1.8, 0.01, "×")}
        ${slider("Mortality", "mortality", 0.6, 1.6, 0.01, "×")}
        ${slider("Migration shock", "migration", -10, 10, 0.1, " /1000")}
        ${slider("GDP growth shock", "growth", -4, 6, 0.1, " pp")}
        <button class="chip" data-act="reset">Reset sliders</button>
        <p class="note">Modeled household uses GDP per person, fertility, and Gini — not a census microdata file. Natural increase ${(fs.annual * 100).toFixed(2)}% / year.</p>
      </section>
    </div>
    <section class="panel">
      <div class="split"><div><p class="kicker">Rank the rest</p><h2>${compare != null ? "Against the pinned pack" : "Open ranking"}</h2></div>
        <div class="row">
          <button class="chip ${state.baseline === "median" ? "on" : ""}" data-act="baseline" data-id="median">Median pack</button>
          <button class="chip ${state.baseline === "mean" ? "on" : ""}" data-act="baseline" data-id="mean">Mean pack</button>
          <button class="chip ${state.sort === "value" ? "on" : ""}" data-act="sort" data-id="value">Sort by value</button>
          <button class="chip ${state.sort === "gap" ? "on" : ""}" data-act="sort" data-id="gap">Sort by gap</button>
          <button class="chip" data-act="clear">Clear pins</button>
        </div></div>
      <div class="pack">${pins.map((c) => `<article><button class="link" data-act="focus" data-id="${c.id}">${c.flag} ${esc(c.name)}</button><strong>${present(m, val(c))}</strong><button class="chip" data-act="toggle-pin" data-id="${c.id}">Remove</button></article>`).join("") || `<p class="note">Pin one or more countries. Everyone else ranks against them.</p>`}</div>
      <div class="board-wrap"><table class="board"><thead><tr><th>Rank</th><th>Country</th><th>Value</th><th>Vs pack</th><th></th></tr></thead><tbody>
        ${rows.slice(0, 80).map((r, i) => `<tr class="${r.c.id === state.focus ? "on" : ""}"><td>${i + 1}</td><td><button class="link" data-act="focus" data-id="${r.c.id}">${r.c.flag} ${esc(r.c.name)}</button></td><td>${present(m, r.v)}</td><td class="${r.gap == null ? "" : (m.lower ? r.gap < 0 : r.gap > 0) ? "good" : "bad"}">${r.gap == null ? "—" : (r.gap > 0 ? "+" : "") + r.gap.toFixed(1) + "%"}</td><td><button class="chip" data-act="toggle-pin" data-id="${r.c.id}">Pin</button></td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">Baselines pulled ${esc(DATA.pulled)}. ${esc(DATA.note)} Weather is live from Open-Meteo when you are online. Offline, the atlas still ranks.</p>
    </section>`;
  bind();
  loadSky(focus);
}
function slider(label, key, min, max, step, suffix) {
  const v = state.levers[key];
  const shown = step >= 1 ? String(v) : Number(v).toFixed(step < 0.1 ? 1 : 2);
  return `<label class="sl"><span>${label}</span><span>${shown}${suffix}</span><input type="range" data-lever="${key}" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${label}"/></label>`;
}
function bind() {
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; render(); q.focus(); });
  app.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", () => {
    const act = el.dataset.act, id = el.dataset.id;
    if (act === "theme") state.theme = id;
    if (act === "region") state.region = id;
    if (act === "group") { state.group = id; state.metric = METRICS.find((m) => m.group === id).id; }
    if (act === "metric") state.metric = id;
    if (act === "lens") { state.lens = id; if (id === "ppp" && state.metric === "gdpPc") state.metric = "gdpPppPc"; if (id === "nominal" && state.metric === "gdpPppPc") state.metric = "gdpPc"; }
    if (act === "rate") state.rate = id;
    if (act === "mode") state.mode = id;
    if (act === "flag") state[id] = !state[id];
    if (act === "focus") state.focus = id;
    if (act === "toggle-pin") state.pins = state.pins.includes(id) ? state.pins.filter((x) => x !== id) : [...state.pins, id].slice(-8);
    if (act === "baseline") state.baseline = id;
    if (act === "sort") state.sort = id;
    if (act === "clear") state.pins = [];
    if (act === "reset") state.levers = { years: 0, fertility: 1, mortality: 1, migration: 0, growth: 0 };
    render();
  }));
  document.getElementById("map").addEventListener("click", (event) => {
    const iso = event.target.getAttribute && event.target.getAttribute("data-iso");
    const c = iso && byIso.get(iso);
    if (!c) return;
    if (state.mode === "pin") state.pins = state.pins.includes(c.id) ? state.pins.filter((x) => x !== c.id) : [...state.pins, c.id].slice(-8);
    else state.focus = c.id;
    render();
  });
  const ghost = document.getElementById("ghost");
  ghost.addEventListener("change", () => { state.ghostId = ghost.value; state.ghost = true; render(); });
  const suffixes = { years: " yr", fertility: "×", mortality: "×", migration: " /1000", growth: " pp" };
  app.querySelectorAll("[data-lever]").forEach((input) => {
    input.addEventListener("input", () => {
      const key = input.dataset.lever;
      state.levers[key] = Number(input.value);
      const shown = Number(input.step) >= 1 ? String(Math.round(Number(input.value))) : Number(input.value).toFixed(Number(input.step) < 0.1 ? 1 : 2);
      input.parentElement.querySelectorAll("span")[1].textContent = shown + suffixes[key];
    });
    input.addEventListener("change", () => render());
  });
}
function loadSky(c) {
  const token = ++wxToken;
  const box = document.getElementById("sky");
  if (!box || !navigator.onLine) { if (box) box.textContent = c.capital + " · weather needs a connection"; return; }
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lng}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`)
    .then((r) => r.json()).then((j) => {
      if (token !== wxToken || !document.getElementById("sky")) return;
      const cur = j.current;
      document.getElementById("sky").textContent = `${c.capital} · ${Number(cur.temperature_2m).toFixed(0)}°C · wind ${Math.round(cur.wind_speed_10m)} km/h`;
    }).catch(() => { if (token === wxToken && document.getElementById("sky")) document.getElementById("sky").textContent = c.capital + " · weather feed unreachable"; });
}
render();

</script>
