<!DOCTYPE html>
<!-- Snapshots: newest 5 copies of THIS file live in snapshots/AI Creator/Generation Take Rack.html/ (per app, not a global pool). Never leave .bak next to the live tool. See snapshots/README.md -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generation Take Rack — AI HTML Toolbox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎞️</text></svg>">
<link rel="stylesheet" href="../shared/aitoolbox-ui.css?v=1.16.48">
<link rel="stylesheet" href="../shared/aitoolbox-layout.css?v=1.16.48">
<style>
:root{--bg:#07090e;--panel:#10161e;--line:rgba(251,191,36,.22);--accent:#fbbf24;--accent2:#67e8f9;--ok:#34d399;--bad:#f87171;--text:#e8eef4;--muted:#8b9bb0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:radial-gradient(ellipse 60% 40% at 80% 0,rgba(251,191,36,.12),transparent 50%),var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
.nav{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(7,9,14,.92);position:sticky;top:0;z-index:20;flex-wrap:wrap}
.nav a{color:var(--accent2);text-decoration:none;font-weight:700;font-size:13px}
.nav h1{font-size:14px;letter-spacing:.12em;color:var(--accent)}
.btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.btn.ghost{border-color:var(--line);color:var(--text)}
.layout{display:flex;min-height:calc(100dvh - 52px)}
.side{width:280px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
.main{flex:1;min-width:0;padding:16px;overflow:auto}
label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font:inherit}
textarea{min-height:70px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#121820,#0c1118);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.card.on,.card:hover{border-color:var(--accent);box-shadow:0 0 18px rgba(251,191,36,.12)}
.card.keep{border-color:rgba(52,211,153,.45)} .card.kill{opacity:.55;border-color:rgba(248,113,113,.35)}
.stars{color:var(--accent);letter-spacing:2px;font-size:13px}
.meta{font-size:11px;color:var(--muted);margin:6px 0}
.prompt{font-size:12px;line-height:1.4;max-height:4.6em;overflow:hidden}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .span{grid-column:1/-1}
.stat{font-size:12px;color:var(--accent2);margin-bottom:10px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare pre{white-space:pre-wrap;font-size:11px;background:rgba(0,0,0,.35);padding:10px;border-radius:8px;border:1px solid var(--line);min-height:160px}
@media(max-width:860px){.layout{flex-direction:column}.side{width:auto;border:0;border-bottom:1px solid var(--line)}.form,.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="nav">
  <a class="toolbox-back" href="../Toolbox Launcher.html">← Toolbox</a>
  <h1>GENERATION TAKE RACK</h1>
  <span style="color:var(--muted);font-size:12px;flex:1">Rank seeds, models, and prompts. Keep / maybe / kill — local film strip.</span>
  <span data-fafo-layout-toolbar></span>
  <button type="button" class="btn ghost" id="btnExport">Export</button>
  <button type="button" class="btn ghost" id="btnImport">Import</button>
  <input id="fileIn" type="file" accept="application/json" hidden>
</nav>
<div class="layout" data-fafo-layout-root data-fafo-layout-app="generation-take-rack" data-fafo-layout-type="columns" data-fafo-layout-page-scroll="1">
  <aside class="side" data-fafo-panel="sidebar" data-fafo-panel-title="Take" data-fafo-panel-min="240" data-fafo-panel-default="300">
    <div class="stat" id="stats"></div>
    <div class="form">
      <div class="span"><label>Title</label><input id="tTitle" placeholder="Chorus still 03"></div>
      <div><label>Kind</label><select id="tKind"><option>image</option><option>video</option><option>audio</option><option>upscale</option></select></div>
      <div><label>Model</label><input id="tModel" placeholder="Imagine / Kling / …"></div>
      <div><label>Seed</label><input id="tSeed" placeholder="auto"></div>
      <div><label>Steps / duration</label><input id="tSteps"></div>
      <div class="span"><label>Prompt</label><textarea id="tPrompt"></textarea></div>
      <div class="span"><label>Negative</label><textarea id="tNeg" style="min-height:48px"></textarea></div>
      <div class="span"><label>File / path note</label><input id="tPath" placeholder="local filename or folder note"></div>
      <div><label>Rating</label><select id="tRate"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></div>
      <div><label>Verdict</label><select id="tVerdict"><option>maybe</option><option>keep</option><option>kill</option></select></div>
      <div class="span"><label>Notes</label><textarea id="tNotes" style="min-height:48px"></textarea></div>
    </div>
    <div class="row">
      <button type="button" class="btn" id="btnAdd">Add take</button>
      <button type="button" class="btn ghost" id="btnUpd">Update selected</button>
      <button type="button" class="btn ghost" id="btnDel">Delete</button>
    </div>
  </aside>
  <section class="main" data-fafo-panel="center" data-fafo-panel-title="Rack" data-fafo-flex="1">
    <div class="row">
      <select id="fKind"><option value="">all kinds</option><option>image</option><option>video</option><option>audio</option><option>upscale</option></select>
      <select id="fVerdict"><option value="">all verdicts</option><option>keep</option><option>maybe</option><option>kill</option></select>
      <input id="fQ" placeholder="Search prompt / model / seed" style="max-width:280px">
      <button type="button" class="btn ghost" id="btnCmp">Compare two selected</button>
    </div>
    <div class="grid" id="grid"></div>
    <div id="cmp" class="compare" hidden></div>
  </section>
</div>
<script src="../shared/aitoolbox-config.js?v=1.16.48"></script>
<script src="../shared/aitoolbox-version.js?v=1.16.48"></script>
<script src="../shared/aitoolbox-api.js?v=1.16.48"></script>
<script src="../shared/aitoolbox-ui.js?v=1.16.48"></script>
<script src="../shared/aitoolbox-layout.js?v=1.16.48"></script>
<script src="../shared/aitoolbox-pro.js?v=1.16.48"></script>
<script>
const KEY='fafo_gen_take_rack_v1';
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return Array.isArray(r)?r:null}catch(_){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(takes))}catch(_){}}
function seed(){return [
  {id:uid(),title:'Alley wide v2',kind:'image',model:'Imagine',seed:'44192',steps:'30',prompt:'wet neon alley, lone figure, magenta practicals, anamorphic 35mm, rain, cinematic still',neg:'text, watermark, extra limbs',path:'takes/alley-wide-02.png',rate:5,verdict:'keep',notes:'hero still',at:Date.now()},
  {id:uid(),title:'Orbit chorus',kind:'video',model:'Kling',seed:'8821',steps:'5s',prompt:'orbit two dancers in neon rain, music video, long coats',neg:'morphing faces',path:'takes/chorus-orbit.mp4',rate:4,verdict:'maybe',notes:'faces drift at 3s',at:Date.now()},
  {id:uid(),title:'Close rain',kind:'image',model:'Imagine',seed:'1190',steps:'28',prompt:'macro rain on eyelashes, neon bokeh',neg:'',path:'takes/cu-rain.png',rate:2,verdict:'kill',notes:'soft, unusable',at:Date.now()}
]}
let takes=load()||seed();
let sel=new Set();
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
function filtered(){
  const k=$('fKind').value,v=$('fVerdict').value,q=$('fQ').value.toLowerCase();
  return takes.filter(t=>(!k||t.kind===k)&&(!v||t.verdict===v)&&(!q||JSON.stringify(t).toLowerCase().includes(q)));
}
function render(){
  const list=filtered();
  $('grid').innerHTML=list.map(t=>`<article class="card ${t.verdict} ${sel.has(t.id)?'on':''}" data-id="${t.id}">
    <strong>${esc(t.title)}</strong>
    <div class="stars">${stars(+t.rate||0)}</div>
    <div class="meta">${esc(t.kind)} · ${esc(t.model)} · seed ${esc(t.seed)} · ${esc(t.verdict)}</div>
    <div class="prompt">${esc(t.prompt)}</div>
    <div class="meta">${esc(t.path)}</div>
  </article>`).join('')||'<p style="color:var(--muted)">No takes match.</p>';
  const n=takes.length,k=takes.filter(t=>t.verdict==='keep').length;
  $('stats').textContent=`${n} takes · ${k} keep (${n?Math.round(k/n*100):0}%) · avg ${(takes.reduce((s,t)=>s+(+t.rate||0),0)/(n||1)).toFixed(1)}★`;
}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&','<':'<','>':'>','"':'"'}[c]))}
function readForm(){return {title:$('tTitle').value.trim()||'Untitled',kind:$('tKind').value,model:$('tModel').value,seed:$('tSeed').value,steps:$('tSteps').value,prompt:$('tPrompt').value,neg:$('tNeg').value,path:$('tPath').value,rate:+$('tRate').value,verdict:$('tVerdict').value,notes:$('tNotes').value}}
function fill(t){if(!t)return;$('tTitle').value=t.title;$('tKind').value=t.kind;$('tModel').value=t.model;$('tSeed').value=t.seed;$('tSteps').value=t.steps;$('tPrompt').value=t.prompt;$('tNeg').value=t.neg;$('tPath').value=t.path;$('tRate').value=String(t.rate);$('tVerdict').value=t.verdict;$('tNotes').value=t.notes}
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id;
  if(e.shiftKey){if(sel.has(id))sel.delete(id);else sel.add(id)} else {sel=new Set([id]);fill(takes.find(t=>t.id===id))}
  render();
});
$('btnAdd').onclick=()=>{takes.unshift({id:uid(),...readForm(),at:Date.now()});save();render();AIToolboxUI?.toast?.('Take added','ok')};
$('btnUpd').onclick=()=>{const id=[...sel][0];const t=takes.find(x=>x.id===id);if(!t){AIToolboxUI?.toast?.('Select a take','warn');return}Object.assign(t,readForm());save();render()};
$('btnDel').onclick=()=>{if(!sel.size)return;takes=takes.filter(t=>!sel.has(t.id));sel.clear();save();render()};
['fKind','fVerdict','fQ'].forEach(id=>$(id).addEventListener('input',render));
$('btnCmp').onclick=()=>{
  const ids=[...sel].slice(0,2);if(ids.length<2){AIToolboxUI?.toast?.('Shift-click two takes','warn');return}
  const a=takes.find(t=>t.id===ids[0]),b=takes.find(t=>t.id===ids[1]);
  $('cmp').hidden=false;
  $('cmp').innerHTML=`<pre>${esc(fmt(a))}</pre><pre>${esc(fmt(b))}</pre>`;
};
function fmt(t){return `${t.title}\n${t.kind} · ${t.model} · seed ${t.seed} · ${t.steps}\n${t.verdict} ${stars(t.rate)}\n\n${t.prompt}\n\nNEG: ${t.neg}\n${t.path}\n${t.notes}`}
$('btnExport').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(takes,null,2)],{type:'application/json'}));a.download='take-rack.json';a.click()};
$('btnImport').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;takes=j;save();render()}catch(_){AIToolboxUI?.toast?.('Bad JSON','warn')}};r.readAsText(f)};
render();
</script>
</body>
</html>
